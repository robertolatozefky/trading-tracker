<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0a0a;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;font-size:16px}
body{overscroll-behavior:none}
#root{max-width:480px;margin:0 auto;padding:0 16px 90px}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.bnav{position:fixed;bottom:0;left:0;right:0;background:#0f0f0f;border-top:0.5px solid #1e1e1e;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,16px)}
.nbtn{flex:1;padding:10px 4px 8px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#444;cursor:pointer;transition:color 0.15s}
.nbtn.on{color:#1D9E75}
.nbtn svg{width:22px;height:22px}
.card{background:#141414;border:0.5px solid #1e1e1e;border-radius:14px;padding:16px}
.card-sm{background:#141414;border:0.5px solid #1a1a1a;border-radius:10px;padding:12px 14px}
.surface{background:#1c1c1c;border-radius:10px;padding:12px 14px}
.finput{width:100%;padding:10px 12px;font-size:14px;border:0.5px solid #2a2a2a;border-radius:10px;background:#1c1c1c;color:#f0f0f0;outline:none;transition:border-color 0.15s}
.finput:focus{border-color:#333}
.finput::placeholder{color:#383838}
.pill{font-size:12px;padding:6px 12px;border-radius:20px;border:0.5px solid #2a2a2a;background:transparent;color:#555;cursor:pointer;white-space:nowrap;transition:all 0.15s}
.pill.on{background:#1D9E75;color:#fff;border-color:#1D9E75}
input[type=range]{width:100%;height:3px;accent-color:#1D9E75;cursor:pointer}
.chk{width:20px;height:20px;border-radius:6px;border:0.5px solid #2a2a2a;background:#1c1c1c;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s}
.chk.on{background:#1D9E75;border-color:#1D9E75}
.btn-p{width:100%;padding:14px;font-size:15px;font-weight:500;border:none;border-radius:12px;background:#1D9E75;color:#fff;cursor:pointer;transition:opacity 0.15s}
.btn-p:disabled{opacity:0.25;cursor:default}
.btn-s{width:100%;padding:12px;font-size:14px;border:0.5px solid #2a2a2a;border-radius:12px;background:transparent;color:#666;cursor:pointer}
.tsw{display:flex;gap:6px;background:#111;border-radius:10px;padding:4px;margin-bottom:20px}
.tswb{flex:1;padding:7px;font-size:13px;border:none;border-radius:7px;background:transparent;color:#555;cursor:pointer;transition:all 0.15s;white-space:nowrap}
.tswb.on{background:#1c1c1c;color:#f0f0f0}
.pbar{height:3px;border-radius:2px;background:#1c1c1c;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;background:#1D9E75;transition:width 0.4s}
.lbl{font-size:11px;font-weight:500;color:#444;text-transform:uppercase;letter-spacing:0.06em}
.div{height:0.5px;background:#1a1a1a;margin:20px 0}
</style>
</head>
<body>
<h1 class="sr-only">Trading Tracker V5</h1>
<div id="root"></div>
<script type="text/babel">
const {useState,useCallback,useMemo,useRef,useEffect}=React;
const SK='tt_v5';

const QUOTES=[
  {q:"El mercado es el maestro más caro del mundo. Aprende barato o el te cobrará caro.",a:"Jesse Livermore"},
  {q:"No operes para ganar dinero. Opera para ejecutar bien. El dinero es consecuencia.",a:"Mark Douglas"},
  {q:"El trading no es sobre tener razón. Es sobre cuánto ganas cuando tienes razón y cuánto pierdes cuando no.",a:"George Soros"},
  {q:"La paciencia no es esperar. Es mantener la actitud correcta mientras esperas.",a:"Anónimo"},
  {q:"El hombre que mueve montañas comienza moviendo piedras pequeñas.",a:"Confucio"},
  {q:"La disciplina es el puente entre metas y logros.",a:"Jim Rohn"},
  {q:"No busques oportunidades. Prepárate y las oportunidades te encontrarán.",a:"Seneca"},
  {q:"Un trade perdido siguiendo el plan vale más que un trade ganado por suerte.",a:"Mark Douglas"},
  {q:"El éxito no es definitivo, el fracaso no es fatal. Lo que cuenta es el coraje de continuar.",a:"Winston Churchill"},
  {q:"Los mercados pueden permanecer irracionales más tiempo del que tú puedes permanecer solvente.",a:"John Maynard Keynes"},
  {q:"Si no puedes controlar tus emociones, no puedes controlar tu dinero.",a:"Warren Buffett"},
  {q:"La diferencia entre un trader exitoso y uno fallido no es el sistema. Es la ejecución.",a:"Van Tharp"},
  {q:"El dolor de la disciplina es temporal. El dolor del arrepentimiento es eterno.",a:"Jim Rohn"},
  {q:"Primero aprende a no perder. La ganancia viene sola después.",a:"Ed Seykota"},
  {q:"El mercado nunca está equivocado. Las opiniones sí.",a:"Jesse Livermore"},
  {q:"Todo hombre que sabe lo que quiere puede obtenerlo si está dispuesto a pagar el precio.",a:"Bertrand Russell"},
  {q:"No confundas actividad con productividad. Muchas veces el mejor trade es no operar.",a:"Anónimo"},
  {q:"La fortaleza no viene de ganar. Viene de la lucha. Cuando decides no rendirte, eso es fortaleza.",a:"Arnold Schwarzenegger"},
  {q:"Lo que sabes hoy no es suficiente para mañana.",a:"Albert Einstein"},
  {q:"El mercado recompensa la paciencia y castiga la impaciencia.",a:"Warren Buffett"},
  {q:"No importa cuántas veces caes. Lo que importa es cuántas veces te levantas.",a:"Vince Lombardi"},
  {q:"El trader que sobrevive no es el más inteligente. Es el más disciplinado.",a:"Anónimo"},
  {q:"Actúa como si lo que haces hace la diferencia. La hace.",a:"William James"},
  {q:"Sólo quien tiene la paciencia para hacer las cosas simples con perfección adquiere la habilidad para hacer las cosas difíciles.",a:"Friedrich Schiller"},
  {q:"Cada pérdida es una lección. Cada ganancia, una prueba de disciplina.",a:"Anónimo"},
  {q:"El riesgo viene de no saber lo que estás haciendo.",a:"Warren Buffett"},
  {q:"La adversidad tiene el don de despertar talentos que en la prosperidad habrían permanecido dormidos.",a:"Horacio"},
  {q:"No eres lo que sientes. Eres lo que haces cuando sientes.",a:"Anónimo"},
  {q:"Los grandes traders no predicen. Reaccionan.",a:"Anónimo"},
  {q:"Si no controlas el drawdown, el drawdown te controla a ti.",a:"Anónimo"},
];

const WEEKS=[
  {n:1,mes:1,focus:'Un solo setup',task:'Elige 1 setup SMC/ICT. Define reglas de entrada, SL y TP por escrito.',checks:['Setup elegido y nombrado','Reglas de entrada documentadas','SL y TP definidos por escrito']},
  {n:2,mes:1,focus:'Backtesting × 25',task:'25 trades históricos en TradingView. Solo el setup elegido.',checks:['25 trades completados','Resultados registrados','Screenshot de cada trade']},
  {n:3,mes:1,focus:'Backtesting × 50',task:'25 trades más. Calcular win rate y RR promedio.',checks:['50 trades totales','Win rate calculado','RR promedio calculado']},
  {n:4,mes:1,focus:'Revisión de mes 1',task:'Analizar los 50 trades. ¿Expectativa positiva? ¿Mejor sesión?',checks:['Análisis completado','Expectativa calculada','Sesión óptima identificada']},
  {n:5,mes:2,focus:'Paper trading live',task:'Ejecutar el setup en demo en tiempo real. NY open y/o power hour.',checks:['Cuenta demo activa','Trades ejecutados','Journal iniciado']},
  {n:6,mes:2,focus:'Journaling estricto',task:'Cada trade con screenshot + razón + emoción.',checks:['100% trades con screenshot','Emoción registrada','Patrón de error identificado']},
  {n:7,mes:2,focus:'Ajuste de reglas',task:'Refinar el setup. No cambiar completo — ajustar filtros.',checks:['Filtros ajustados','Setup refinado','Reglas actualizadas']},
  {n:8,mes:2,focus:'Decisión go/no-go',task:'¿60+ trades con expectativa positiva? Considera prop firm o micro live.',checks:['60+ trades totales','Expectativa positiva','Decisión tomada']},
];
const CHECKLIST=['¿El HTF confirma dirección (H4/D1)?','¿El setup es exactamente el que definí?','¿Estoy en la sesión correcta?','¿El SL está definido antes de entrar?','¿El riesgo es máximo 1% del capital?','¿Entro por setup o por impulso/FOMO?'];
const SESIONES=['NY Open','Power Hour','London','Asia'];
const DS={activeTab:'inicio',weekProgress:{},trades:[],capital:5000,riskPct:1,wr:45,rr:2.0,activeWeek:1,checklist:{},checklistDate:'',quoteIdx:0};

function load(){try{const r=localStorage.getItem(SK);if(r)return{...DS,...JSON.parse(r)}}catch(e){}return DS}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s))}catch(e){}}

const G='#1D9E75',G2='#0F6E56',GBG='rgba(29,158,117,0.12)';
const RED='#E24B4A',RBG='rgba(226,75,74,0.12)';
const AMB='#BA7517',ABG='rgba(186,117,23,0.12)';
const rC=r=>r==='W'?G:r==='L'?RED:AMB;
const rBg=r=>r==='W'?GBG:r==='L'?RBG:ABG;
const rTxt=r=>r==='W'?G:r==='L'?RED:AMB;
const rLbl=r=>r==='W'?'Win':r==='L'?'Loss':'BE';

function calcRR(entrada,sl,salida){
  const e=parseFloat(entrada),s=parseFloat(sl),x=parseFloat(salida);
  if(isNaN(e)||isNaN(s)||isNaN(x)||s===e)return null;
  const risk=Math.abs(e-s);
  const reward=Math.abs(x-e);
  return parseFloat((reward/risk).toFixed(2));
}

function calcM(trades){
  if(!trades.length)return{wr:0,rrAvg:0,exp:0,adh:0,wins:0,losses:0,total:0};
  const wins=trades.filter(t=>t.resultado==='W');
  const losses=trades.filter(t=>t.resultado==='L');
  const wr=wins.length/trades.length;
  const avgWR=wins.length?wins.reduce((a,t)=>a+(parseFloat(t.rr)||0),0)/wins.length:0;
  const exp=(wr*avgWR)-(1-wr);
  const rrSum=trades.reduce((a,t)=>a+(t.resultado==='W'?parseFloat(t.rr)||0:-1),0);
  const adh=trades.filter(t=>t.adherencia).length/trades.length;
  return{wr:Math.round(wr*100),rrAvg:parseFloat((rrSum/trades.length).toFixed(2)),exp:parseFloat(exp.toFixed(2)),adh:Math.round(adh*100),wins:wins.length,losses:losses.length,total:trades.length};
}
function calcEq(trades,cap,rp){
  if(!trades.length)return[];
  const sorted=[...trades].sort((a,b)=>a.fecha<b.fecha?-1:1);
  let c=cap;
  const pts=[{x:'Inicio',y:c,t:null}];
  sorted.forEach((t,i)=>{
    const risk=c*(rp/100);
    const delta=t.resultado==='W'?(risk*(parseFloat(t.rr)||0)):t.resultado==='L'?-risk:0;
    c=parseFloat((c+delta).toFixed(2));
    pts.push({x:t.fecha||`T${i+1}`,y:c,t});
  });
  return pts;
}
function calcDD(pts){let p=pts[0]?.y||0,m=0;pts.forEach(pt=>{if(pt.y>p)p=pt.y;const d=(p-pt.y)/p*100;if(d>m)m=d;});return parseFloat(m.toFixed(2));}
function calcStrk(trades){
  const s=[...trades].sort((a,b)=>a.fecha<b.fecha?-1:1);
  let mW=0,mL=0,cW=0,cL=0;
  s.forEach(t=>{if(t.resultado==='W'){cW++;cL=0;if(cW>mW)mW=cW;}else if(t.resultado==='L'){cL++;cW=0;if(cL>mL)mL=cL;}else{cW=0;cL=0;}});
  return{win:mW,loss:mL};
}
function bestSes(trades){
  if(!trades.length)return'—';
  const m={};
  trades.forEach(t=>{if(!m[t.sesion])m[t.sesion]={w:0,tot:0};m[t.sesion].tot++;if(t.resultado==='W')m[t.sesion].w++;});
  let best='—',br=-1;
  Object.entries(m).forEach(([s,v])=>{const r=v.w/v.tot;if(r>br&&v.tot>=2){br=r;best=s;}});
  return best;
}

/* primitives */
function Lbl({children,mb=12}){return<div className="lbl" style={{marginBottom:mb}}>{children}</div>}
function Div(){return<div className="div"/>}
function MCard({label,value,sub,accent}){
  return(
    <div style={{background:accent?GBG:'#141414',border:`0.5px solid ${accent?'rgba(29,158,117,0.2)':'#1e1e1e'}`,borderRadius:12,padding:'16px 14px'}}>
      <div style={{fontSize:12,color:accent?G2:'#555',marginBottom:6}}>{label}</div>
      <div style={{fontSize:20,fontWeight:600,color:accent?G:'#f0f0f0',letterSpacing:'-0.3px'}}>{value}</div>
      {sub&&<div style={{fontSize:11,color:accent?G2:'#444',marginTop:3}}>{sub}</div>}
    </div>
  );
}
function Pill({label,active,onClick}){return<button className={`pill${active?' on':''}`} onClick={onClick}>{label}</button>;}
function Chk({checked,onChange}){return<div className={`chk${checked?' on':''}`} onClick={onChange}>{checked&&<svg width="11" height="9" viewBox="0 0 11 9"><polyline points="1,4.5 4.5,8 10,1" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}</div>;}
function FRow({label,children,hint}){return<div style={{marginBottom:14}}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}><div style={{fontSize:12,color:'#555'}}>{label}</div>{hint&&<div style={{fontSize:11,color:G,fontWeight:500}}>{hint}</div>}</div>{children}</div>;}
function FInput(p){return<input className="finput" {...p}/>;}
function FSelect({value,onChange,children}){return<select className="finput" value={value} onChange={onChange}>{children}</select>;}

/* ── INICIO ── */
function InicioTab({state,setState}){
  const trades=state.trades||[];
  const last5=[...trades].sort((a,b)=>b.id-a.id).slice(0,5);
  const m=calcM(trades);
  const today=new Date().toLocaleDateString('es-VE',{weekday:'long',day:'numeric',month:'long'});

  const q=QUOTES[state.quoteIdx%QUOTES.length];
  const nextQ=()=>setState(s=>({...s,quoteIdx:(s.quoteIdx+1)%QUOTES.length}));

  const weeksDone=WEEKS.filter(w=>w.checks.every((_,i)=>state.weekProgress[`${w.n}-${i}`])).length;

  return(
    <div style={{paddingTop:24}}>
      {/* header */}
      <div style={{marginBottom:28}}>
        <div style={{fontSize:12,color:'#444',marginBottom:4,textTransform:'capitalize'}}>{today}</div>
        <div style={{fontSize:28,fontWeight:600,letterSpacing:'-0.5px',color:'#f0f0f0'}}>Trading Tracker</div>
      </div>

      {/* quote card */}
      <div style={{background:'#0f0f0f',border:'0.5px solid #1e1e1e',borderRadius:16,padding:'20px',marginBottom:24,position:'relative'}} onClick={nextQ}>
        <div style={{fontSize:30,color:'#1a1a1a',fontFamily:'Georgia,serif',position:'absolute',top:12,left:16,lineHeight:1}}>"</div>
        <div style={{fontSize:15,color:'#bbb',lineHeight:1.7,marginBottom:14,paddingTop:8,fontStyle:'italic'}}>{q.q}</div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div style={{fontSize:12,color:G,fontWeight:500}}>— {q.a}</div>
          <div style={{fontSize:11,color:'#333'}}>tap para cambiar</div>
        </div>
      </div>

      {/* snapshot */}
      {trades.length>0&&(
        <>
          <Lbl>Snapshot</Lbl>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:24}}>
            <MCard label="Total trades" value={m.total} sub={`${m.wins}W · ${m.losses}L`}/>
            <MCard label="Win rate" value={`${m.wr}%`} sub="acumulado"/>
            <MCard label="Expectativa" value={m.exp} sub={m.exp>0?'con edge':'sin edge'} accent={m.exp>0}/>
            <MCard label="Semanas" value={`${weeksDone}/8`} sub="completadas" accent={weeksDone===8}/>
          </div>
        </>
      )}

      {/* últimos 5 trades */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <Lbl mb={0}>Últimos trades</Lbl>
        {trades.length>0&&<button onClick={()=>setState(s=>({...s,activeTab:'trades'}))} style={{fontSize:12,color:G,background:'none',border:'none',cursor:'pointer'}}>Ver todos →</button>}
      </div>

      {last5.length===0&&(
        <div style={{background:'#0f0f0f',border:'0.5px solid #1a1a1a',borderRadius:12,padding:'28px 16px',textAlign:'center'}}>
          <div style={{fontSize:14,color:'#333',lineHeight:2}}>Sin trades aún.<br/><span style={{color:'#444'}}>Empieza a registrar en el log.</span></div>
          <button onClick={()=>setState(s=>({...s,activeTab:'trades'}))} className="btn-p" style={{marginTop:16,width:'auto',padding:'10px 24px'}}>Ir a Trades →</button>
        </div>
      )}

      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {last5.map(t=>(
          <div key={t.id} style={{background:'#141414',border:'0.5px solid #1a1a1a',borderLeft:`2px solid ${rC(t.resultado)}`,borderRadius:10,padding:'12px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:12,fontWeight:500,color:rTxt(t.resultado),background:rBg(t.resultado),padding:'3px 9px',borderRadius:20}}>{rLbl(t.resultado)}</span>
              <div>
                <div style={{fontSize:13,fontWeight:500,color:'#ccc'}}>{t.dir==='L'?'Long':'Short'} · RR {t.rr}</div>
                <div style={{fontSize:11,color:'#444'}}>{t.fecha} · {t.sesion}</div>
              </div>
            </div>
            <div style={{fontSize:13,fontWeight:600,color:rTxt(t.resultado)}}>{t.resultado==='W'?'+':t.resultado==='L'?'-':''}{t.rr}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── SEMANAS ── */
function SemanasTab({state,setState}){
  const{weekProgress,activeWeek}=state;
  const tog=(wn,i)=>setState(s=>({...s,weekProgress:{...s.weekProgress,[`${wn}-${i}`]:!s.weekProgress[`${wn}-${i}`]}}));
  const isDone=w=>w.checks.every((_,i)=>weekProgress[`${w.n}-${i}`]);
  const cw=WEEKS.find(w=>w.n===activeWeek)||WEEKS[0];
  const done=WEEKS.filter(isDone).length;
  const pct=Math.round(done/8*100);
  return(
    <div style={{paddingTop:24}}>
      <div style={{marginBottom:24}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:10}}>
          <div><div className="lbl" style={{marginBottom:4}}>Progreso general</div><div style={{fontSize:32,fontWeight:600,color:'#f0f0f0',letterSpacing:'-0.5px'}}>{pct}<span style={{fontSize:18,color:'#444',fontWeight:400}}>%</span></div></div>
          <div style={{textAlign:'right'}}><div style={{fontSize:22,fontWeight:500,color:G}}>{done}<span style={{fontSize:13,color:'#444',fontWeight:400}}>/8</span></div><div style={{fontSize:11,color:'#444'}}>semanas</div></div>
        </div>
        <div className="pbar"><div className="pbar-fill" style={{width:`${pct}%`}}/></div>
      </div>
      <Lbl>Semana activa</Lbl>
      <div style={{display:'flex',gap:8,marginBottom:20,overflowX:'auto',paddingBottom:4}}>
        {WEEKS.map(w=>{const d=isDone(w),active=w.n===activeWeek;return(
          <button key={w.n} onClick={()=>setState(s=>({...s,activeWeek:w.n}))} style={{minWidth:42,height:42,borderRadius:10,flexShrink:0,fontSize:14,fontWeight:500,border:`0.5px solid ${active?G:d?'#1a2e25':'#1e1e1e'}`,background:d?'#0d2018':active?'#1c1c1c':'#111',color:d?G:active?'#f0f0f0':'#444'}}>{w.n}</button>
        )})}
      </div>
      <div className="card" style={{marginBottom:20}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:12}}>
          <div><div style={{fontSize:11,color:'#444',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:5}}>Semana {cw.n} · Mes {cw.mes}</div><div style={{fontSize:18,fontWeight:500}}>{cw.focus}</div></div>
          {isDone(cw)&&<span style={{fontSize:11,padding:'3px 9px',borderRadius:20,background:GBG,color:G,fontWeight:500,whiteSpace:'nowrap',marginLeft:8}}>Lista</span>}
        </div>
        <div style={{fontSize:14,color:'#666',marginBottom:16,lineHeight:1.65}}>{cw.task}</div>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          {cw.checks.map((c,i)=>{const checked=!!weekProgress[`${cw.n}-${i}`];return(
            <div key={i} style={{display:'flex',alignItems:'center',gap:12}} onClick={()=>tog(cw.n,i)}>
              <Chk checked={checked} onChange={()=>tog(cw.n,i)}/>
              <span style={{fontSize:14,color:checked?'#444':'#ccc',textDecoration:checked?'line-through':'none',cursor:'pointer',lineHeight:1.4}}>{c}</span>
            </div>
          )})}
        </div>
      </div>
      <Lbl>Vista por mes</Lbl>
      {[1,2].map(mes=>(
        <div key={mes} className="card" style={{marginBottom:10}}>
          <div style={{fontSize:11,color:'#444',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:12}}>Mes {mes} — {mes===1?'Backtesting':'Paper trading'}</div>
          {WEEKS.filter(w=>w.mes===mes).map((w,i)=>(
            <div key={w.n} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 0',borderTop:i===0?'none':'0.5px solid #1a1a1a'}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:11,color:'#444',minWidth:16}}>S{w.n}</span>
                <span style={{fontSize:14,color:isDone(w)?'#555':'#ccc',textDecoration:isDone(w)?'line-through':'none'}}>{w.focus}</span>
              </div>
              {isDone(w)?<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill={G}/><polyline points="5,9 7.5,12 13,6" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/></svg>:<div style={{width:18,height:18,borderRadius:'50%',border:'0.5px solid #2a2a2a'}}/>}
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

/* ── TRADES ── */
function TradesTab({state,setState}){
  const[view,setView]=useState('log');
  const[form,setForm]=useState({fecha:'',dir:'L',resultado:'W',rr:'',entrada:'',sl:'',salida:'',sesion:'NY Open',semana:1,notas:'',adherencia:true});
  const[filters,setFilters]=useState({resultado:'Todos',sesion:'Todas',semana:'Todas',mes:'Todos'});
  const[importErr,setImportErr]=useState('');
  const fileRef=useRef(null);
  const trades=state.trades||[];

  const autoRR=useMemo(()=>{
    if(form.entrada&&form.sl&&form.salida){
      return calcRR(form.entrada,form.sl,form.salida);
    }return null;
  },[form.entrada,form.sl,form.salida]);

  const addTrade=()=>{
    if(!form.fecha)return;
    const finalRR=autoRR!==null?autoRR:(parseFloat(form.rr)||0);
    if(!finalRR)return;
    const wk=WEEKS.find(w=>w.n===parseInt(form.semana));
    setState(s=>({...s,trades:[{...form,id:Date.now(),rr:finalRR,mes:wk?.mes||1},...s.trades]}));
    setForm({fecha:'',dir:'L',resultado:'W',rr:'',entrada:'',sl:'',salida:'',sesion:'NY Open',semana:1,notas:'',adherencia:true});
    setView('log');
  };

  const canSave=form.fecha&&(autoRR!==null||form.rr);

  const delTrade=id=>setState(s=>({...s,trades:s.trades.filter(t=>t.id!==id)}));

  const importCSV=e=>{
    const file=e.target.files[0];if(!file)return;setImportErr('');
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const lines=ev.target.result.trim().split('\n');
        const hdrs=lines[0].split(',').map(h=>h.trim());
        const miss=['fecha','dir','resultado','rr'].filter(r=>!hdrs.includes(r));
        if(miss.length){setImportErr(`Columnas faltantes: ${miss.join(', ')}`);return;}
        const imp=lines.slice(1).map((line,i)=>{
          const vals=line.split(',');const o={};
          hdrs.forEach((h,j)=>o[h]=vals[j]?.trim()||'');
          return{id:Date.now()+i,fecha:o.fecha||'',dir:o.dir||'L',resultado:o.resultado||'W',rr:parseFloat(o.rr)||0,sesion:o.sesion||'NY Open',semana:parseInt(o.semana)||1,mes:parseInt(o.mes)||1,adherencia:o.adherencia!=='false',notas:o.notas||''};
        }).filter(t=>t.fecha);
        if(!imp.length){setImportErr('No se encontraron trades válidos.');return;}
        setState(s=>({...s,trades:[...imp,...s.trades]}));
        setView('log');setImportErr('');
      }catch(err){setImportErr('Error al leer el archivo.');}
    };
    reader.readAsText(file);e.target.value='';
  };

  const exportCSV=()=>{
    const csv=['fecha,dir,resultado,rr,semana,mes,sesion,adherencia,notas',...trades.map(t=>`${t.fecha},${t.dir},${t.resultado},${t.rr},${t.semana||1},${t.mes||1},${t.sesion},${t.adherencia},${t.notas||''}`)].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='trades_backup.csv';a.click();
  };

  const filtered=useMemo(()=>trades.filter(t=>{
    if(filters.resultado!=='Todos'&&t.resultado!==filters.resultado)return false;
    if(filters.sesion!=='Todas'&&t.sesion!==filters.sesion)return false;
    if(filters.semana!=='Todas'&&String(t.semana)!==String(filters.semana))return false;
    if(filters.mes!=='Todos'&&String(t.mes)!==String(filters.mes))return false;
    return true;
  }),[trades,filters]);

  const m=calcM(filtered);
  const afc=Object.values(filters).filter(v=>v!=='Todos'&&v!=='Todas').length;

  return(
    <div style={{paddingTop:24}}>
      <div className="tsw">
        {[['log','Log'],['agregar','+ Agregar'],['importar','↑ Importar']].map(([v,l])=>(
          <button key={v} className={`tswb${view===v?' on':''}`} onClick={()=>setView(v)}>{l}</button>
        ))}
      </div>

      {view==='agregar'&&(
        <div className="card" style={{marginBottom:16}}>
          <div style={{fontSize:17,fontWeight:500,marginBottom:16}}>Nuevo trade</div>
          <FRow label="Fecha"><FInput type="date" value={form.fecha} onChange={e=>setForm(f=>({...f,fecha:e.target.value}))}/></FRow>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <FRow label="Dirección"><FSelect value={form.dir} onChange={e=>setForm(f=>({...f,dir:e.target.value}))}><option value="L">Long</option><option value="S">Short</option></FSelect></FRow>
            <FRow label="Resultado"><FSelect value={form.resultado} onChange={e=>setForm(f=>({...f,resultado:e.target.value}))}><option value="W">Win</option><option value="L">Loss</option><option value="BE">Breakeven</option></FSelect></FRow>
          </div>

          {/* precio fields */}
          <div style={{background:'#0f0f0f',border:'0.5px solid #1e1e1e',borderRadius:10,padding:'14px',marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <div style={{fontSize:12,color:'#555'}}>Calcular RR automático</div>
              {autoRR!==null&&<div style={{fontSize:13,fontWeight:600,color:G}}>RR = {autoRR}</div>}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
              <div>
                <div style={{fontSize:11,color:'#444',marginBottom:5}}>Entrada</div>
                <FInput type="number" step="0.00001" placeholder="1.08500" value={form.entrada} onChange={e=>setForm(f=>({...f,entrada:e.target.value}))}/>
              </div>
              <div>
                <div style={{fontSize:11,color:'#444',marginBottom:5}}>Stop Loss</div>
                <FInput type="number" step="0.00001" placeholder="1.08200" value={form.sl} onChange={e=>setForm(f=>({...f,sl:e.target.value}))}/>
              </div>
              <div>
                <div style={{fontSize:11,color:'#444',marginBottom:5}}>Salida</div>
                <FInput type="number" step="0.00001" placeholder="1.09100" value={form.salida} onChange={e=>setForm(f=>({...f,salida:e.target.value}))}/>
              </div>
            </div>
            {autoRR===null&&(form.entrada||form.sl||form.salida)&&<div style={{fontSize:11,color:'#444',marginTop:8}}>Completa los 3 campos para calcular el RR.</div>}
          </div>

          <FRow label="RR manual" hint={autoRR!==null?'auto-calculado':undefined}>
            <FInput type="number" step="0.1" placeholder={autoRR!==null?`${autoRR} (calculado)`:'Ingresa el RR manualmente'} value={autoRR!==null?'':form.rr} disabled={autoRR!==null} onChange={e=>setForm(f=>({...f,rr:e.target.value}))} style={{opacity:autoRR!==null?0.4:1}}/>
          </FRow>

          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <FRow label="Semana"><FSelect value={form.semana} onChange={e=>setForm(f=>({...f,semana:parseInt(e.target.value)}))}>{WEEKS.map(w=><option key={w.n} value={w.n}>S{w.n} M{w.mes}</option>)}</FSelect></FRow>
            <FRow label="Sesión"><FSelect value={form.sesion} onChange={e=>setForm(f=>({...f,sesion:e.target.value}))}>{SESIONES.map(s=><option key={s}>{s}</option>)}</FSelect></FRow>
          </div>
          <FRow label="Notas"><FInput placeholder="Observación del trade..." value={form.notas} onChange={e=>setForm(f=>({...f,notas:e.target.value}))}/></FRow>
          <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:18}} onClick={()=>setForm(f=>({...f,adherencia:!f.adherencia}))}>
            <Chk checked={form.adherencia} onChange={()=>setForm(f=>({...f,adherencia:!f.adherencia}))}/>
            <span style={{fontSize:14,color:'#666',cursor:'pointer'}}>Seguí exactamente el plan</span>
          </div>
          <button className="btn-p" onClick={addTrade} disabled={!canSave}>Guardar trade</button>
        </div>
      )}

      {view==='importar'&&(
        <div className="card" style={{marginBottom:16}}>
          <div style={{fontSize:17,fontWeight:500,marginBottom:12}}>Importar CSV</div>
          <div style={{fontSize:14,color:'#555',marginBottom:14,lineHeight:1.6}}>Columnas requeridas: <code style={{fontSize:12,background:'#1c1c1c',padding:'2px 6px',borderRadius:4,color:'#888'}}>fecha, dir, resultado, rr</code></div>
          <div style={{background:'#0f0f0f',borderRadius:8,padding:'10px 12px',marginBottom:14,fontFamily:'monospace',fontSize:11,color:'#444',lineHeight:1.9,overflowX:'auto',whiteSpace:'nowrap',border:'0.5px solid #1e1e1e'}}>
            fecha,dir,resultado,rr,semana,sesion<br/>
            2024-01-15,L,W,2.1,1,NY Open
          </div>
          <input ref={fileRef} type="file" accept=".csv" onChange={importCSV} style={{display:'none'}}/>
          <button className="btn-s" style={{marginBottom:8}} onClick={()=>fileRef.current?.click()}>Seleccionar archivo CSV</button>
          {importErr&&<div style={{fontSize:13,color:RED,background:RBG,padding:'8px 12px',borderRadius:8,marginTop:8}}>{importErr}</div>}
          <div style={{fontSize:12,color:'#333',marginTop:10}}>Los trades importados se agregan al historial existente.</div>
        </div>
      )}

      {view==='log'&&(
        <>
          <div className="card" style={{marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
              <Lbl mb={0}>Filtros</Lbl>
              {afc>0&&<button onClick={()=>setFilters({resultado:'Todos',sesion:'Todas',semana:'Todas',mes:'Todos'})} style={{fontSize:11,color:'#444',background:'none',border:'none',cursor:'pointer'}}>Limpiar</button>}
            </div>
            {[
              {label:'Resultado',key:'resultado',opts:['Todos','W','L','BE'],fmt:v=>v==='W'?'Win':v==='L'?'Loss':v==='BE'?'BE':v},
              {label:'Sesión',key:'sesion',opts:['Todas',...SESIONES],fmt:v=>v},
              {label:'Semana',key:'semana',opts:['Todas','1','2','3','4','5','6','7','8'],fmt:v=>v==='Todas'?'Todas':`S${v}`},
              {label:'Mes',key:'mes',opts:['Todos','1','2'],fmt:v=>v==='Todos'?'Todos':`M${v}`},
            ].map(({label,key,opts,fmt})=>(
              <div key={key} style={{marginBottom:10}}>
                <div style={{fontSize:11,color:'#2a2a2a',marginBottom:6}}>{label}</div>
                <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:2}}>
                  {opts.map(v=><Pill key={v} label={fmt(v)} active={filters[key]===v} onClick={()=>setFilters(f=>({...f,[key]:v}))}/>)}
                </div>
              </div>
            ))}
          </div>

          {filtered.length>0&&(
            <>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
                <span style={{fontSize:12,color:'#444'}}>{afc>0?`${filtered.length} de ${trades.length} trades`:`${trades.length} trades`}</span>
                {afc>0&&<span style={{fontSize:11,padding:'3px 9px',borderRadius:20,background:'rgba(55,138,221,0.12)',color:'#378ADD',fontWeight:500}}>{afc} filtro{afc>1?'s':''}</span>}
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:16}}>
                <MCard label="Win rate" value={`${m.wr}%`} sub={`${m.wins}W · ${m.losses}L`}/>
                <MCard label="Expectativa" value={m.exp} sub={m.exp>0?'con edge':'sin edge'} accent={m.exp>0}/>
              </div>
            </>
          )}

          {trades.length===0&&<div style={{fontSize:14,color:'#2a2a2a',textAlign:'center',padding:'4rem 0',lineHeight:2}}>Sin trades aún.<br/><span style={{color:'#333'}}>Toca "+ Agregar" para empezar.</span></div>}
          {trades.length>0&&filtered.length===0&&<div style={{fontSize:14,color:'#333',textAlign:'center',padding:'3rem 0'}}>Ningún trade coincide.</div>}

          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {filtered.map(t=>(
              <div key={t.id} className="card-sm" style={{borderLeft:`2px solid ${rC(t.resultado)}`}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:12,fontWeight:500,color:rTxt(t.resultado),background:rBg(t.resultado),padding:'3px 10px',borderRadius:20}}>{rLbl(t.resultado)}</span>
                    <span style={{fontSize:14,fontWeight:500,color:'#ccc'}}>{t.dir==='L'?'Long':'Short'}</span>
                    <span style={{fontSize:14,color:'#444'}}>RR {t.rr}</span>
                  </div>
                  <button onClick={()=>delTrade(t.id)} style={{fontSize:12,color:'#2a2a2a',background:'none',border:'none',padding:'2px 6px',cursor:'pointer'}}>✕</button>
                </div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',fontSize:11,color:'#444'}}>
                  <span>{t.fecha}</span><span>·</span><span>{t.sesion}</span>
                  <span>·</span><span>S{t.semana||'?'} M{t.mes||'?'}</span>
                  {!t.adherencia&&<><span>·</span><span style={{color:RED}}>fuera de plan</span></>}
                </div>
                {t.notas&&<div style={{fontSize:12,color:'#444',marginTop:6,fontStyle:'italic'}}>{t.notas}</div>}
              </div>
            ))}
          </div>
          {trades.length>0&&<button className="btn-s" style={{marginTop:14}} onClick={exportCSV}>Exportar CSV ↓</button>}
        </>
      )}
    </div>
  );
}

/* ── MÉTRICAS ── */
function EqChart({trades,capital,riskPct}){
  const ref=useRef(null);const cRef=useRef(null);
  const pts=useMemo(()=>calcEq(trades,capital,riskPct),[trades,capital,riskPct]);
  useEffect(()=>{
    if(!ref.current||pts.length<2)return;
    if(cRef.current)cRef.current.destroy();
    cRef.current=new Chart(ref.current,{
      type:'line',
      data:{labels:pts.map(p=>p.x),datasets:[{data:pts.map(p=>p.y),borderColor:G,borderWidth:2,pointBackgroundColor:pts.map((p,i)=>i===0?'transparent':rC(p.t?.resultado||'BE')),pointBorderColor:pts.map((p,i)=>i===0?'transparent':rC(p.t?.resultado||'BE')),pointRadius:pts.map((_,i)=>i===0?0:5),pointHoverRadius:7,fill:false,tension:0.15}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'$'+ctx.parsed.y.toLocaleString()}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:5,font:{size:10},color:'#444',maxRotation:45},border:{color:'#1e1e1e'}},y:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{font:{size:10},color:'#444',callback:v=>'$'+v.toLocaleString()},border:{color:'#1e1e1e'}}}}
    });
    return()=>{if(cRef.current){cRef.current.destroy();cRef.current=null;}};
  },[pts]);
  if(pts.length<2)return<div style={{fontSize:13,color:'#333',textAlign:'center',padding:'2rem 0'}}>Agrega trades para ver la curva.</div>;
  const fin=pts[pts.length-1].y,pnl=parseFloat((fin-capital).toFixed(2)),pct=parseFloat(((pnl/capital)*100).toFixed(2)),dd=calcDD(pts);
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
        <MCard label="Capital actual" value={`$${fin.toLocaleString()}`} sub={`inicio $${capital.toLocaleString()}`}/>
        <MCard label="P&L total" value={`${pnl>=0?'+':''}$${pnl.toLocaleString()}`} sub={`${pct>=0?'+':''}${pct}%`} accent={pnl>=0}/>
      </div>
      <div style={{display:'flex',gap:16,fontSize:11,color:'#444',marginBottom:10,flexWrap:'wrap'}}>
        {[[G,'Win'],[RED,'Loss'],[AMB,'BE']].map(([c,l])=>(
          <span key={l} style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:7,height:7,borderRadius:'50%',background:c,display:'inline-block'}}/>{l}</span>
        ))}
        <span style={{marginLeft:'auto',fontSize:11,color:'#444'}}>Max DD {dd}%</span>
      </div>
      <div style={{position:'relative',height:200}}><canvas ref={ref} role="img" aria-label="Curva de equity"/></div>
    </div>
  );
}

function MetricasTab({state}){
  const trades=state.trades||[];
  const m=calcM(trades);
  const strk=calcStrk(trades);
  const bs=bestSes(trades);
  const pts=calcEq(trades,state.capital,state.riskPct);
  const dd=calcDD(pts);
  const bySes=useMemo(()=>{
    const map={};
    trades.forEach(t=>{if(!map[t.sesion])map[t.sesion]={w:0,l:0,be:0};if(t.resultado==='W')map[t.sesion].w++;else if(t.resultado==='L')map[t.sesion].l++;else map[t.sesion].be++;});
    return Object.entries(map).map(([s,v])=>({s,tot:v.w+v.l+v.be,wr:Math.round(v.w/(v.w+v.l+v.be)*100),...v})).sort((a,b)=>b.wr-a.wr);
  },[trades]);
  if(!trades.length)return<div style={{fontSize:14,color:'#333',textAlign:'center',padding:'4rem 1rem',lineHeight:2}}>Sin trades registrados.<br/><span style={{color:'#444'}}>Agrega trades en el log.</span></div>;
  return(
    <div style={{paddingTop:24}}>
      <Lbl>Curva de equity</Lbl>
      <div className="card" style={{marginBottom:24}}><EqChart trades={trades} capital={state.capital} riskPct={state.riskPct}/></div>
      <Lbl>Métricas globales</Lbl>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:24}}>
        <MCard label="Win rate" value={`${m.wr}%`} sub={`${m.wins}W · ${m.losses}L · ${m.total-(m.wins+m.losses)}BE`}/>
        <MCard label="Expectativa" value={m.exp} sub={m.exp>0?'sistema con edge':'sin edge'} accent={m.exp>0}/>
        <MCard label="RR promedio" value={m.rrAvg} sub="ajustado por trade"/>
        <MCard label="Adherencia" value={`${m.adh}%`} sub={m.adh>=85?'objetivo ok':'meta: 85%'} accent={m.adh>=85}/>
      </div>
      <Lbl>Riesgo</Lbl>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:24}}>
        <MCard label="Max drawdown" value={`${dd}%`} sub={dd<6?'dentro del límite':'supera el 6%'}/>
        <MCard label="Mejor sesión" value={bs} sub="≥2 trades"/>
        <MCard label="Racha win" value={strk.win} sub="máxima consecutiva"/>
        <MCard label="Racha loss" value={strk.loss} sub="máxima consecutiva"/>
      </div>
      <Lbl>Win rate por sesión</Lbl>
      <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:24}}>
        {bySes.map(({s,tot,wr})=>(
          <div key={s} className="card-sm">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:14,color:'#ccc'}}>{s}</span>
              <div style={{display:'flex',alignItems:'center',gap:10}}><span style={{fontSize:11,color:'#444'}}>{tot} trades</span><span style={{fontSize:16,fontWeight:500,color:wr>=50?G:RED}}>{wr}%</span></div>
            </div>
            <div className="pbar"><div className="pbar-fill" style={{width:`${wr}%`,background:wr>=50?G:RED}}/></div>
          </div>
        ))}
        {bySes.length===0&&<div style={{fontSize:13,color:'#333'}}>Sin datos de sesión.</div>}
      </div>
      <Lbl>Umbrales para ir live</Lbl>
      <div className="card">
        {[
          {label:'Muestra mínima',display:`${m.total} trades`,ok:m.total>=60,meta:'60 trades'},
          {label:'Expectativa positiva',display:String(m.exp),ok:m.exp>0,meta:'> 0'},
          {label:'Adherencia al plan',display:`${m.adh}%`,ok:m.adh>=85,meta:'85%'},
          {label:'Drawdown máximo',display:`${dd}%`,ok:dd<6,meta:'< 6%'},
        ].map(({label,display,ok,meta},i,arr)=>(
          <div key={label} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',borderBottom:i<arr.length-1?'0.5px solid #1a1a1a':'none'}}>
            <div style={{width:20,height:20,borderRadius:'50%',background:ok?G:RED,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
              {ok?<svg width="11" height="9" viewBox="0 0 11 9"><polyline points="1,4.5 4.5,8 10,1" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round"/></svg>:<svg width="9" height="9" viewBox="0 0 9 9"><line x1="1" y1="1" x2="8" y2="8" stroke="#fff" strokeWidth="2" strokeLinecap="round"/><line x1="8" y1="1" x2="1" y2="8" stroke="#fff" strokeWidth="2" strokeLinecap="round"/></svg>}
            </div>
            <span style={{fontSize:14,color:'#888',flex:1}}>{label}</span>
            <span style={{fontSize:14,fontWeight:500,color:ok?G:RED}}>{display}</span>
            <span style={{fontSize:11,color:'#333',minWidth:44,textAlign:'right'}}>{meta}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── CALCULADORA ── */
function CalcTab({state,setState}){
  const{capital,riskPct,wr,rr}=state;
  const exp=parseFloat(((wr/100*rr)-(1-wr/100)).toFixed(2));
  const riskAmt=(capital*riskPct/100).toFixed(2);

  function SlRow({label,val,min,max,step=1,sKey,onChange}){
    const[loc,setLoc]=useState(String(val));
    useEffect(()=>setLoc(String(val)),[val]);
    const commit=v=>{const n=parseFloat(v);if(!isNaN(n)&&n>=min&&n<=max)setState(s=>({...s,[sKey]:step<1?parseFloat(n.toFixed(2)):Math.round(n)}));};
    return(
      <div style={{marginBottom:22}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
          <span style={{fontSize:13,color:'#555'}}>{label}</span>
          <input type="number" value={loc} min={min} max={max} step={step}
            onChange={e=>setLoc(e.target.value)}
            onBlur={e=>commit(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&commit(e.target.value)}
            style={{width:78,padding:'6px 8px',fontSize:14,fontWeight:500,textAlign:'center',border:'0.5px solid #2a2a2a',borderRadius:8,background:'#1c1c1c',color:'#f0f0f0',outline:'none'}}
          />
        </div>
        <input type="range" min={min} max={max} step={step} value={val} onChange={onChange} style={{width:'100%'}}/>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:4}}>
          <span style={{fontSize:10,color:'#2a2a2a'}}>{min}</span>
          <span style={{fontSize:10,color:'#2a2a2a'}}>{max}</span>
        </div>
      </div>
    );
  }

  return(
    <div style={{paddingTop:24}}>
      <Lbl>Expectativa del sistema</Lbl>
      <div style={{background:'#0f0f0f',borderRadius:10,padding:'12px 14px',marginBottom:24,border:'0.5px solid #1a1a1a'}}>
        <span style={{fontFamily:'monospace',fontSize:15,color:'#444'}}>E = (WR × RR) − (1 − WR)</span>
        <div style={{fontSize:11,color:'#2a2a2a',marginTop:4}}>Resultado &gt; 0 = sistema con edge</div>
      </div>
      <SlRow label="Win rate (%)" val={wr} min={1} max={99} sKey="wr" onChange={e=>setState(s=>({...s,wr:+e.target.value}))}/>
      <SlRow label="RR promedio" val={rr} min={0.5} max={5} step={0.1} sKey="rr" onChange={e=>setState(s=>({...s,rr:parseFloat(e.target.value)}))}/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'20px 0',borderTop:'0.5px solid #1a1a1a',borderBottom:'0.5px solid #1a1a1a',marginBottom:12}}>
        <span style={{fontSize:15,fontWeight:500,color:'#666'}}>Expectativa</span>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <span style={{fontSize:32,fontWeight:600,color:exp>0?G:exp===0?'#888':RED,letterSpacing:'-0.5px'}}>{exp}</span>
          <span style={{fontSize:11,padding:'3px 9px',borderRadius:20,fontWeight:500,background:exp>0?GBG:exp===0?'#1c1c1c':RBG,color:exp>0?G:exp===0?'#555':RED}}>{exp>0?'Con edge':exp===0?'Breakeven':'Sin edge'}</span>
        </div>
      </div>
      <div style={{fontSize:13,color:'#444',marginBottom:32,lineHeight:1.7}}>{exp>0?`Por cada $1 arriesgado, ganas $${Math.abs(exp).toFixed(2)} en promedio.`:exp===0?'El sistema no gana ni pierde.':'Sin edge — revisar el setup.'}</div>
      <Lbl>Riesgo por trade</Lbl>
      <SlRow label="Capital ($)" val={capital} min={500} max={150000} step={500} sKey="capital" onChange={e=>setState(s=>({...s,capital:+e.target.value}))}/>
      <SlRow label="Riesgo (%)" val={riskPct} min={0.25} max={3} step={0.25} sKey="riskPct" onChange={e=>setState(s=>({...s,riskPct:+e.target.value}))}/>
      <div style={{background:GBG,border:'0.5px solid rgba(29,158,117,0.15)',borderRadius:12,padding:'16px',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
        <div><div style={{fontSize:12,color:G2,marginBottom:4}}>Riesgo por trade</div><div style={{fontSize:11,color:'#2a2a2a'}}>máx. por posición</div></div>
        <span style={{fontSize:32,fontWeight:600,color:G,letterSpacing:'-0.5px'}}>${parseFloat(riskAmt).toLocaleString()}</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <MCard label="Stop loss máx." value={`$${parseFloat(riskAmt).toLocaleString()}`} sub="si SL = 100% riesgo"/>
        <MCard label="5 pérdidas" value={`$${(parseFloat(riskAmt)*5).toLocaleString()}`} sub="drawdown potencial"/>
      </div>
    </div>
  );
}

/* ── CHECKLIST ── */
function CheckTab({state,setState}){
  const today=new Date().toISOString().slice(0,10);
  const isToday=state.checklistDate===today;
  const checks=isToday?(state.checklist||{}):{};
  const tog=i=>{const nc={...checks,[i]:!checks[i]};setState(s=>({...s,checklist:nc,checklistDate:today}));};
  const done=CHECKLIST.filter((_,i)=>checks[i]).length;
  const all=done===CHECKLIST.length;
  return(
    <div style={{paddingTop:24}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:20}}>
        <div><Lbl mb={4}>Pre-trade</Lbl><div style={{fontSize:13,color:'#444'}}>{today}</div></div>
        <div style={{textAlign:'right'}}><div style={{fontSize:26,fontWeight:600,color:all?G:'#ccc',letterSpacing:'-0.3px'}}>{done}<span style={{fontSize:14,color:'#333',fontWeight:400}}>/{CHECKLIST.length}</span></div></div>
      </div>
      <div className="pbar" style={{marginBottom:20}}><div className="pbar-fill" style={{width:`${Math.round(done/CHECKLIST.length*100)}%`}}/></div>
      <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:24}}>
        {CHECKLIST.map((c,i)=>{const checked=!!checks[i];return(
          <div key={i} onClick={()=>tog(i)} style={{display:'flex',alignItems:'center',gap:14,background:checked?GBG:'#141414',border:`0.5px solid ${checked?'rgba(29,158,117,0.2)':'#1e1e1e'}`,borderRadius:12,padding:'14px',cursor:'pointer',transition:'all 0.15s'}}>
            <Chk checked={checked} onChange={()=>tog(i)}/>
            <span style={{fontSize:14,color:checked?G:'#aaa',textDecoration:checked?'line-through':'none',lineHeight:1.45}}>{c}</span>
          </div>
        )})}
      </div>
      {all&&<div style={{background:GBG,border:'0.5px solid rgba(29,158,117,0.2)',borderRadius:12,padding:'14px 16px',fontSize:14,color:G,fontWeight:500,textAlign:'center',marginBottom:24}}>Todo confirmado — puedes evaluar entrada.</div>}
      <Div/>
      <Lbl>Journal por trade</Lbl>
      {[{c:'#378ADD',t:'Antes',d:'Screenshot marcado, razón de entrada, HTF, sesión, SL y TP.'},{c:G,t:'Después',d:'Resultado, RR realizado, ¿seguí el plan?, P&L.'},{c:AMB,t:'Psicología',d:'Estado emocional. ¿Moví el SL? ¿Saqué antes? Honestidad total.'}].map(item=>(
        <div key={item.t} className="card-sm" style={{marginBottom:8,borderLeft:`2px solid ${item.c}`}}>
          <div style={{fontSize:13,fontWeight:500,color:'#ccc',marginBottom:4}}>{item.t}</div>
          <div style={{fontSize:13,color:'#555',lineHeight:1.6}}>{item.d}</div>
        </div>
      ))}
    </div>
  );
}

/* ── APP ── */
const NAV=[
  {id:'inicio',label:'Inicio',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>},
  {id:'semanas',label:'Semanas',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>},
  {id:'trades',label:'Trades',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>},
  {id:'metricas',label:'Métricas',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>},
  {id:'calc',label:'Calc.',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="16" y2="12"/><line x1="8" y1="17" x2="10" y2="17"/><line x1="14" y1="17" x2="16" y2="17"/></svg>},
];

function App(){
  const[state,setRaw]=useState(load);
  const set=useCallback(upd=>{setRaw(prev=>{const next=typeof upd==='function'?upd(prev):upd;save(next);return next;});},[]);
  const panels={
    inicio:<InicioTab state={state} setState={set}/>,
    semanas:<SemanasTab state={state} setState={set}/>,
    trades:<TradesTab state={state} setState={set}/>,
    metricas:<MetricasTab state={state}/>,
    calc:<CalcTab state={state} setState={set}/>,
    checklist:<CheckTab state={state} setState={set}/>,
  };
  return(
    <>
      {panels[state.activeTab]||panels['inicio']}
      <nav className="bnav">
        {NAV.map(({id,label,icon})=>(
          <button key={id} className={`nbtn${state.activeTab===id?' on':''}`} onClick={()=>set(s=>({...s,activeTab:id}))}>
            {icon}<span>{label}</span>
          </button>
        ))}
      </nav>
    </>
  );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
