<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meridian">
<meta name="theme-color" content="#ede8da">
<title>Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,300;1,9..144,400;1,9..144,600;1,9..144,700&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#ede8da;color:#1e1a14;font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.5}
body{overscroll-behavior:none}
#root{max-width:480px;margin:0 auto;padding:0 24px 110px}
input,select,textarea,button{font-family:'Instrument Sans',sans-serif}
button{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

:root{
  --bg:#ede8da;
  --bg2:#e4dece;
  --bg3:#d9d2c0;
  --ink:#1e1a14;
  --ink70:#5a5448;
  --ink40:#9c9485;
  --ink15:#ccc6b8;
  --blue:#1e3d5c;
  --blue2:#2a5278;
  --blue-bg:rgba(30,61,92,0.07);
  --blue-bord:rgba(30,61,92,0.15);
  --win:#2d6a4f;
  --win-bg:rgba(45,106,79,0.08);
  --win-bord:rgba(45,106,79,0.2);
  --loss:#8b3020;
  --loss-bg:rgba(139,48,32,0.07);
  --loss-bord:rgba(139,48,32,0.18);
  --be:#7a5c10;
  --be-bg:rgba(122,92,16,0.07);
  --be-bord:rgba(122,92,16,0.18);
  --r:14px;
  --r-sm:10px;
}

/* ── ISLAND NAV ── */
.bnav{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:#1e1a14;border-radius:60px;
  display:flex;z-index:100;padding:8px;gap:2px;
  box-shadow:0 8px 40px rgba(30,26,20,0.22),0 2px 8px rgba(30,26,20,0.12);
  max-width:400px;width:calc(100% - 32px);
}
.nbtn{
  flex:1;padding:9px 6px;border:none;background:none;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  color:rgba(237,232,218,0.3);cursor:pointer;
  transition:all 0.2s;border-radius:50px;
  font-size:10px;font-weight:600;letter-spacing:0.03em;
  font-family:'Instrument Sans',sans-serif;white-space:nowrap;
}
.nbtn.on{background:rgba(237,232,218,0.1);color:#ede8da}
.nbtn svg{width:19px;height:19px;flex-shrink:0}
.nbtn-lbl{display:none;font-size:9px;line-height:1}
.nbtn.on .nbtn-lbl{display:block}

/* ── EYEBROW / SECTION HEADER ── */
.eyebrow{
  font-family:'Instrument Sans',sans-serif;
  font-size:10px;font-weight:600;
  color:var(--ink40);text-transform:uppercase;
  letter-spacing:0.12em;margin-bottom:4px;
}
.page-title{
  font-family:'Fraunces',serif;
  font-size:46px;font-weight:700;
  color:var(--ink);line-height:1.0;
  letter-spacing:-1.5px;margin-bottom:6px;
}
.page-sub{
  font-family:'Instrument Serif',serif;
  font-style:italic;font-size:15px;
  color:var(--ink70);line-height:1.5;margin-bottom:24px;
}

/* ── CARDS ── */
.card{background:var(--bg2);border-radius:var(--r);padding:16px}
.card-white{background:#fff;border-radius:var(--r);padding:16px;border:1px solid var(--ink15)}
.card-outline{background:transparent;border-radius:var(--r);padding:16px;border:1px solid var(--ink15)}

/* ── INPUTS ── */
.finput{
  width:100%;padding:12px 0;font-size:15px;
  border:none;border-bottom:1px solid var(--ink15);
  border-radius:0;background:transparent;
  color:var(--ink);outline:none;
  transition:border-color 0.2s;
  font-family:'Instrument Sans',sans-serif;
}
.finput:focus{border-color:var(--blue)}
.finput::placeholder{color:var(--ink40)}
.finput:disabled{opacity:0.35;cursor:default}
.finput-box{
  width:100%;padding:12px 14px;font-size:15px;
  border:1px solid var(--ink15);border-radius:var(--r-sm);
  background:var(--bg);color:var(--ink);outline:none;
  transition:border-color 0.2s;
  font-family:'Instrument Sans',sans-serif;
}
.finput-box:focus{border-color:var(--blue)}

/* ── PILLS ── */
.pill{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--ink15);background:var(--bg);color:var(--ink70);cursor:pointer;white-space:nowrap;transition:all 0.2s;font-weight:500}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ── CHECKBOX ── */
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink15);background:transparent;flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s}
.chk.on{background:var(--blue);border-color:var(--blue)}

/* ── BUTTONS ── */
.btn-p{width:100%;padding:15px;font-size:14px;font-weight:600;border:none;border-radius:60px;background:var(--ink);color:var(--bg);cursor:pointer;letter-spacing:0.01em;transition:opacity 0.15s,transform 0.1s;font-family:'Instrument Sans',sans-serif}
.btn-p:disabled{opacity:0.25;cursor:default}
.btn-p:active:not(:disabled){transform:scale(0.98)}
.btn-s{width:100%;padding:13px;font-size:13px;border:1.5px solid var(--ink15);border-radius:60px;background:transparent;color:var(--ink70);cursor:pointer;font-weight:500;font-family:'Instrument Sans',sans-serif;transition:border-color 0.2s,color 0.2s}
.btn-s:hover{border-color:var(--blue);color:var(--blue)}

/* ── TAB SWITCHER ── */
.tsw{display:flex;gap:2px;background:var(--bg2);border-radius:60px;overflow:hidden;margin-bottom:20px;padding:4px}
.tswb{flex:1;padding:9px 8px;font-size:12px;border:none;border-radius:50px;background:transparent;color:var(--ink40);cursor:pointer;transition:all 0.2s;white-space:nowrap;font-weight:500;font-family:'Instrument Sans',sans-serif}
.tswb.on{background:var(--ink);color:var(--bg);font-weight:600}

/* ── PROGRESS BAR ── */
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;transition:width 0.5s;border-radius:2px}

/* ── DIVIDERS ── */
.div{height:1px;background:var(--ink15);margin:24px 0}
.lbl{font-size:10px;font-weight:600;color:var(--ink40);text-transform:uppercase;letter-spacing:0.10em;margin-bottom:10px;font-family:'Instrument Sans',sans-serif}

/* ── QUOTE ── */
.quote-wrap{background:var(--bg2);border-radius:var(--r);padding:22px 20px 18px;position:relative;cursor:pointer;margin-bottom:24px}
.quote-mark{font-family:'Fraunces',serif;font-size:60px;color:var(--ink15);position:absolute;top:6px;left:16px;line-height:1;user-select:none;font-weight:700}
.quote-text{font-family:'Instrument Serif',serif;font-style:italic;font-size:15px;color:var(--ink);line-height:1.7;margin-bottom:14px;padding-top:12px;padding-left:2px}
.quote-line{border-top:1px dotted var(--ink15);margin-bottom:10px}
.quote-author{font-family:'Instrument Sans',sans-serif;font-size:10px;font-weight:600;color:var(--blue);letter-spacing:0.10em;text-transform:uppercase}

/* ── TRADE CARD ── */
.trade-item{background:var(--bg2);border-radius:var(--r-sm);padding:13px 14px;display:flex;align-items:center;gap:0;overflow:hidden;position:relative}
.trade-bar-left{width:3px;align-self:stretch;border-radius:3px;flex-shrink:0;margin-right:12px;min-height:36px}

/* ── MCS STEP NAV ── */
.step-row{display:flex;gap:4px;margin-bottom:20px}
.step-btn{flex:1;padding:10px 4px;font-size:9px;font-weight:600;border:1.5px solid var(--ink15);border-radius:10px;background:transparent;color:var(--ink40);cursor:pointer;text-transform:uppercase;letter-spacing:0.05em;transition:all 0.2s;font-family:'Instrument Sans',sans-serif;line-height:1.3}
.step-btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ── CHECK ITEM ── */
.chk-item{display:flex;align-items:flex-start;gap:12px;background:var(--bg2);border-radius:var(--r-sm);padding:14px;cursor:pointer;transition:all 0.15s;margin-bottom:6px;border:1px solid transparent}
.chk-item.ok{background:var(--win-bg);border-color:var(--win-bord)}
.chk-item.bad{background:var(--loss-bg);border-color:var(--loss-bord)}
.chk-lbl{font-size:13px;color:var(--ink70);line-height:1.5;transition:color 0.15s;font-family:'Instrument Sans',sans-serif}
.chk-lbl.ok{color:var(--win);text-decoration:line-through}
.chk-lbl.bad{color:var(--loss)}

/* ── RULE CARD ── */
.rule-card{background:var(--bg2);border-radius:var(--r-sm);border-left:3px solid var(--blue);padding:14px 16px;margin-bottom:8px}

/* ── DECISION ── */
.decision-box{border-radius:var(--r);padding:36px 24px;text-align:center;margin-bottom:20px}
.decision-verdict{font-family:'Fraunces',serif;font-style:italic;font-size:56px;font-weight:400;line-height:1;margin-bottom:12px;letter-spacing:-1px}
.decision-sub{font-family:'Instrument Serif',serif;font-style:italic;font-size:14px;line-height:1.7}

/* ── MCARD ── */
.mc{background:var(--bg2);border-radius:var(--r-sm);padding:16px}
.mc-label{font-size:10px;font-weight:600;color:var(--ink40);text-transform:uppercase;letter-spacing:0.09em;margin-bottom:6px;font-family:'Instrument Sans',sans-serif}
.mc-value{font-family:'Fraunces',serif;font-size:26px;font-weight:600;color:var(--ink);line-height:1.05}
.mc-sub{font-size:12px;color:var(--ink40);margin-top:3px;font-family:'Instrument Sans',sans-serif;font-style:italic}

/* ── WEEK CARD ── */
.week-card{background:var(--bg2);border-radius:var(--r);padding:16px;margin-bottom:8px;cursor:pointer;border:1.5px solid transparent;transition:all 0.2s}
.week-card.active{border-color:var(--blue);background:var(--bg)}

/* FORMULA */
.formula{background:var(--bg2);border-radius:var(--r-sm);padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--ink70);margin-bottom:20px;border:1px dashed var(--ink15)}

/* Threshold row */
.thresh-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ink15)}
.thresh-row:last-child{border-bottom:none}
</style>
</head>
<body>
<h1 class="sr-only">Meridian</h1>
<div id="root"></div>
<script type="text/babel">
const {useState,useCallback,useMemo,useRef,useEffect}=React;
const SK='mcs_v7';

const QUOTES=[
  {q:"El mercado es el maestro más caro del mundo. Aprende barato o él te cobrará caro.",a:"Jesse Livermore"},
  {q:"No operes para ganar dinero. Opera para ejecutar bien. El dinero es consecuencia.",a:"Mark Douglas"},
  {q:"El trading no es sobre tener razón. Es sobre cuánto ganas cuando tienes razón y cuánto pierdes cuando no.",a:"George Soros"},
  {q:"La paciencia no es esperar. Es mantener la actitud correcta mientras esperas.",a:"Epicteto"},
  {q:"Un trade perdido siguiendo el plan vale más que un trade ganado por suerte.",a:"Mark Douglas"},
  {q:"El éxito no es definitivo, el fracaso no es fatal. Lo que cuenta es el coraje de continuar.",a:"Winston Churchill"},
  {q:"Si no puedes controlar tus emociones, no puedes controlar tu dinero.",a:"Warren Buffett"},
  {q:"El dolor de la disciplina es temporal. El dolor del arrepentimiento es eterno.",a:"Jim Rohn"},
  {q:"Primero aprende a no perder. La ganancia viene sola después.",a:"Ed Seykota"},
  {q:"El mercado nunca está equivocado. Las opiniones sí.",a:"Jesse Livermore"},
  {q:"No confundas actividad con productividad. Muchas veces el mejor trade es no operar.",a:"Anónimo"},
  {q:"El trader que sobrevive no es el más inteligente. Es el más disciplinado.",a:"Anónimo"},
  {q:"Proceso sobre resultado individual. Siempre.",a:"MCS v1.0"},
  {q:"Sin trades = posición correcta. La ausencia de operaciones es una decisión, no un fracaso.",a:"MCS v1.0"},
  {q:"30 trades para evaluar el edge. La impaciencia destruye sistemas rentables.",a:"MCS v1.0"},
  {q:"El riesgo viene de no saber lo que estás haciendo.",a:"Warren Buffett"},
  {q:"Los grandes traders no predicen. Reaccionan.",a:"Anónimo"},
  {q:"Si no controlas el drawdown, el drawdown te controla a ti.",a:"Anónimo"},
  {q:"Una pérdida dentro del proceso es aceptable. Una pérdida fuera del proceso es cara.",a:"MCS v1.0"},
  {q:"El mercado recompensa la paciencia y castiga la impaciencia.",a:"Warren Buffett"},
];

const WEEKS=[
  {n:1,mes:1,focus:'Un solo setup',task:'Elige 1 setup MCS. Define reglas de entrada, SL y TP por escrito.',checks:['Setup elegido y nombrado','Reglas de entrada documentadas','SL y TP definidos por escrito']},
  {n:2,mes:1,focus:'Backtesting × 25',task:'25 trades históricos. Solo el setup MCS elegido.',checks:['25 trades completados','Resultados registrados','Screenshot de cada trade']},
  {n:3,mes:1,focus:'Backtesting × 50',task:'25 trades más. Calcular win rate y RR promedio.',checks:['50 trades totales','Win rate calculado','RR promedio calculado']},
  {n:4,mes:1,focus:'Revisión mes 1',task:'Analizar los 50 trades. ¿Expectativa positiva? ¿Mejor sesión?',checks:['Análisis completado','Expectativa calculada','Sesión óptima identificada']},
  {n:5,mes:2,focus:'Paper trading live',task:'Ejecutar el setup en demo. Ventana principal 7:00–7:45.',checks:['Cuenta demo activa','Trades ejecutados','Journal iniciado']},
  {n:6,mes:2,focus:'Journaling estricto',task:'Cada trade: screenshot + razón + emoción + capas MCS.',checks:['100% trades documentados','Emoción registrada','Capas MCS verificadas']},
  {n:7,mes:2,focus:'Ajuste de reglas',task:'Refinar el setup según lo observado. No cambiar completo — ajustar filtros.',checks:['Filtros ajustados','Setup refinado','Reglas actualizadas']},
  {n:8,mes:2,focus:'Decisión go/no-go',task:'¿60+ trades con expectativa positiva y adherencia >85%?',checks:['60+ trades totales','Expectativa positiva','Decisión tomada y justificada']},
];

const MARKETS={
  FX:{label:'Forex',pairs:['EUR/USD','GBP/USD','USD/JPY','USD/CHF','AUD/USD','USD/CAD','NZD/USD','EUR/GBP','EUR/JPY','GBP/JPY'],unit:'precio directo',sessions:['Asia','London','NY (7–10 AM)','LO Close (10–12 PM)']},
  FUTURES:{label:'Futuros',pairs:['NQ','MNQ','ES','MES'],unit:'puntos',sessions:['Asia','London','AM Session','LO Close','PM Session']},
  CRYPTO:{label:'Crypto',pairs:['BTC/USD','ETH/USD','SOL/USD'],unit:'precio directo',sessions:['Asia','London','NY (7–10 AM)','LO Close (10–12 PM)']},
};
const ZONE_TYPES=['OB','FVG','Confluencia OB+FVG','Nivel estructural','BSL sweep','SSL sweep'];
const SESGO_TYPES=['Alcista','Bajista','Rango'];

const DS={activeTab:'inicio',weekProgress:{},trades:[],capital:5000,riskVal:0.5,riskOp:1.0,wr:45,rr:2.0,activeWeek:1,checklist:{},checklistDate:'',quoteIdx:0};
function load(){try{const r=localStorage.getItem(SK);if(r)return{...DS,...JSON.parse(r)}}catch(e){}return DS}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s))}catch(e){}}

/* COLORS */
const BLK='#1e1a14',INK70='#5a5448',INK40='#9c9485',INK15='#ccc6b8',BG='#ede8da',BG2='#e4dece',BG3='#d9d2c0';
const BLUE='#1e3d5c',BLUE2='rgba(30,61,92,0.07)',BLUEB='rgba(30,61,92,0.15)';
const WIN='#2d6a4f',WINBG='rgba(45,106,79,0.08)',WINB='rgba(45,106,79,0.2)';
const LOSS='#8b3020',LOSSBG='rgba(139,48,32,0.07)',LOSSB='rgba(139,48,32,0.18)';
const BE='#7a5c10',BEBG='rgba(122,92,16,0.07)',BEB='rgba(122,92,16,0.18)';
const rC=r=>r==='W'?WIN:r==='L'?LOSS:BE;
const rBg=r=>r==='W'?WINBG:r==='L'?LOSSBG:BEBG;
const rLbl=r=>r==='W'?'Win':r==='L'?'Loss':'BE';

function calcRR(e,sl,x){const ev=parseFloat(e),sv=parseFloat(sl),xv=parseFloat(x);if(isNaN(ev)||isNaN(sv)||isNaN(xv)||sv===ev)return null;return parseFloat((Math.abs(xv-ev)/Math.abs(ev-sv)).toFixed(2));}
function calcM(trades){
  if(!trades.length)return{wr:0,rrAvg:0,exp:0,adh:0,wins:0,losses:0,total:0};
  const wins=trades.filter(t=>t.resultado==='W'),losses=trades.filter(t=>t.resultado==='L');
  const wr=wins.length/trades.length;
  const avgWR=wins.length?wins.reduce((a,t)=>a+(parseFloat(t.rr)||0),0)/wins.length:0;
  const exp=(wr*avgWR)-(1-wr);
  const rrSum=trades.reduce((a,t)=>a+(t.resultado==='W'?parseFloat(t.rr)||0:-1),0);
  const adh=trades.filter(t=>t.adherencia).length/trades.length;
  return{wr:Math.round(wr*100),rrAvg:parseFloat((rrSum/trades.length).toFixed(2)),exp:parseFloat(exp.toFixed(2)),adh:Math.round(adh*100),wins:wins.length,losses:losses.length,total:trades.length};
}
function calcEq(trades,cap,rp){
  if(!trades.length)return[];
  const sorted=[...trades].sort((a,b)=>a.fecha<b.fecha?-1:1);
  let c=cap;const pts=[{x:'Inicio',y:c,t:null}];
  sorted.forEach((t,i)=>{const risk=c*(rp/100);const delta=t.resultado==='W'?(risk*(parseFloat(t.rr)||0)):t.resultado==='L'?-risk:0;c=parseFloat((c+delta).toFixed(2));pts.push({x:t.fecha||`T${i+1}`,y:c,t});});
  return pts;
}
function calcDD(pts){let p=pts[0]?.y||0,m=0;pts.forEach(pt=>{if(pt.y>p)p=pt.y;const d=(p-pt.y)/p*100;if(d>m)m=d;});return parseFloat(m.toFixed(2));}
function calcStrk(trades){const s=[...trades].sort((a,b)=>a.fecha<b.fecha?-1:1);let mW=0,mL=0,cW=0,cL=0;s.forEach(t=>{if(t.resultado==='W'){cW++;cL=0;if(cW>mW)mW=cW;}else if(t.resultado==='L'){cL++;cW=0;if(cL>mL)mL=cL;}else{cW=0;cL=0;}});return{win:mW,loss:mL};}
function bestSes(trades){if(!trades.length)return'—';const m={};trades.forEach(t=>{if(!m[t.sesion])m[t.sesion]={w:0,tot:0};m[t.sesion].tot++;if(t.resultado==='W')m[t.sesion].w++;});let best='—',br=-1;Object.entries(m).forEach(([s,v])=>{const r=v.w/v.tot;if(r>br&&v.tot>=2){br=r;best=s;}});return best;}

/* ── PRIMITIVOS ── */
function Div(){return<div className="div"/>}
function Chk({checked,onChange,danger}){
  const bg=checked?(danger?LOSS:BLUE):BG;
  const bord=checked?(danger?LOSS:BLUE):INK15;
  return<div style={{width:20,height:20,borderRadius:6,border:`1.5px solid ${bord}`,background:bg,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'all 0.2s'}} onClick={onChange}>
    {checked&&<svg width="11" height="9" viewBox="0 0 11 9"><polyline points="1,4.5 4.5,8 10,1" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
  </div>;
}
function Pill({label,active,onClick}){return<button className={`pill${active?' on':''}`} onClick={onClick}>{label}</button>;}

function FRow({label,children,hint,mb=14}){
  return<div style={{marginBottom:mb}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
      <div style={{fontSize:10,color:INK40,textTransform:'uppercase',letterSpacing:'0.09em',fontWeight:600}}>{label}</div>
      {hint&&<div style={{fontSize:11,color:BLUE,fontWeight:600,fontFamily:"'JetBrains Mono',monospace"}}>{hint}</div>}
    </div>
    {children}
  </div>;
}

/* Full-width underline input */
function FInput(p){return<input className="finput" {...p}/>;}
function FSelect({value,onChange,children}){return<select className="finput-box" value={value} onChange={onChange}>{children}</select>;}

function NumInput({label,value,onChange,min,max,step=1,unit,hint}){
  const[loc,setLoc]=useState(String(value));
  useEffect(()=>setLoc(String(value)),[value]);
  const commit=v=>{const n=parseFloat(v);if(!isNaN(n)&&n>=min&&n<=max)onChange(step<1?parseFloat(n.toFixed(2)):n);};
  return<FRow label={label} hint={hint}>
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <input className="finput" type="number" value={loc} min={min} max={max} step={step}
        onChange={e=>setLoc(e.target.value)}
        onBlur={e=>commit(e.target.value)}
        onKeyDown={e=>e.key==='Enter'&&commit(e.target.value)}
        style={{fontSize:16}}
      />
      {unit&&<span style={{fontSize:12,color:INK40,whiteSpace:'nowrap',fontFamily:"'JetBrains Mono',monospace"}}>{unit}</span>}
    </div>
  </FRow>;
}

function MCard({label,value,sub,accent,danger}){
  const bg=accent?BLUE2:danger?LOSSBG:BG2;
  const bord=accent?BLUEB:danger?LOSSB:INK15;
  const vc=accent?BLUE:danger?LOSS:BLK;
  const lc=accent?BLUE:danger?LOSS:INK40;
  return<div style={{background:bg,border:`1px solid ${bord}`,padding:'16px',borderRadius:10}}>
    <div style={{fontSize:10,color:lc,textTransform:'uppercase',letterSpacing:'0.09em',fontWeight:600,marginBottom:6}}>{label}</div>
    <div style={{fontSize:26,fontWeight:600,color:vc,fontFamily:"'Fraunces',serif",lineHeight:1.05}}>{value}</div>
    {sub&&<div style={{fontSize:11,color:lc,marginTop:3,fontStyle:'italic'}}>{sub}</div>}

}

/* ── MCS ── */
function MCSTab({state,setState}){
  const[step,setStep]=useState(0);
  const today=new Date().toISOString().slice(0,10);
  const isToday=state.checklistDate===today;

  const CAPA1=[{k:'c1_1',label:'Estructura Daily clara: HH/HL (alcista) o LH/LL (bajista)'},{k:'c1_2',label:'BOS reciente que confirme dirección'},{k:'c1_3',label:'BSL y SSL visibles mapeados'},{k:'c1_4',label:'OB diario sin testear activo'},{k:'c1_5',label:'FVG de Daily como imán de precio'}];
  const CAPA2=[{k:'c2_1',label:'4H alineado con sesgo Daily'},{k:'c2_2',label:'OB o FVG activo en 4H en dirección del sesgo'},{k:'c2_3',label:'Sweep de liquidez reciente en 4H'},{k:'c2_4',label:'Zona exacta refinada en 1H'},{k:'c2_5',label:'CHoCH/BOS en 1H apoyando dirección'},{k:'c2_6',label:'Zona válida: 2 de 3 — OB + FVG + nivel estructural'}];
  const CAPA3=[{k:'c3_1',label:'Precio toca o sweepea ligeramente la zona'},{k:'c3_2',label:'CHoCH en micro confirma cambio de dirección'},{k:'c3_3',label:'Vela de rechazo con cuerpo real (no solo mecha)'},{k:'c3_4',label:'Entrada al cierre de vela o primer retroceso'}];
  const NOOPERAR=[{k:'no_1',label:'Daily sin estructura clara'},{k:'no_2',label:'Precio llegó con impulso que perforó OB'},{k:'no_3',label:'No hay CHoCH en micro — solo toque'},{k:'no_4',label:'Noticia alto impacto en próxima hora'},{k:'no_5',label:'Ya perdiste 2 trades o 2% hoy'},{k:'no_6',label:'Llevas 2 trades ejecutados hoy'}];

  const c1done=CAPA1.filter(c=>checks[c.k]).length;

        <Chk checked={ch} onChange={()=>tog(k)} danger={danger}/>

    </div>

          <CG items={CAPA1}/>
          {c1done<4&&<div style={{fontSize:12,color:LOSS,background:LOSSBG,padding:'10px 14px',marginTop:14,borderRadius:10,border:`1px solid ${LOSSB}`}}>Mínimo 4 de 5 condiciones para continuar.</div>}
          {c1done>=4&&<div style={{fontSize:12,color:WIN,background:WINBG,padding:'10px 14px',marginTop:14,borderRadius:10,border:`1px solid ${WINB}`}}>✓ Sesgo diario confirmado — ir a Capa 2.</div>}

            <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:600,color:BLK}}>Capa 2 — Contexto 4H+1H</div>

          <CG items={CAPA2}/>

      {step===2&&(

          <CG items={CAPA3}/>

          <button onClick={()=>setStep(3)} className="btn-p" style={{marginTop:16}}>Siguiente → No operar si...</button>

          <CG items={NOOPERAR} danger/>

          {!noOperar&&<div style={{fontSize:13,color:WIN,background:WINBG,padding:'12px 14px',marginTop:14,borderRadius:10,border:`1px solid ${WINB}`}}>✓ Sin restricciones activas.</div>}

        </>
      )}
      {step===4&&(
        <>
          <div className="lbl" style={{marginBottom:16}}>Decisión MCS</div>

              <div key={l} style={{padding:'14px',background:BG2,textAlign:'center',borderRadius:10}}>

        {t:'Sin trades = posición correcta',d:'La ausencia de operaciones es una decisión activa, no un fallo.'},

  const[importErr,setImportErr]=useState('');
  const fileRef=useRef(null);
  const trades=state.trades||[];
  const autoRR=useMemo(()=>calcRR(form.entrada,form.sl,form.salida),[form.entrada,form.sl,form.salida]);
  const mktData=MARKETS[form.mercado]||MARKETS.FX;
  useEffect(()=>{const m=MARKETS[form.mercado];if(m)setForm(f=>({...f,par:m.pairs[0],sesion:m.sessions[0]}));},[form.mercado]);

  const addTrade=()=>{
    if(!form.fecha)return;
    const finalRR=autoRR!==null?autoRR:(parseFloat(form.rr)||0);
    if(!finalRR)return;
    setState(s=>({...s,trades:[{...form,id:Date.now(),rr:finalRR},...s.trades]}));
    setForm(f=>({...f,fecha:'',rr:'',entrada:'',sl:'',salida:'',notas:''}));
    setView('log');
  };
  const canSave=form.fecha&&(autoRR!==null||form.rr);
  const delTrade=id=>setState(s=>({...s,trades:s.trades.filter(t=>t.id!==id)}));

  const importCSV=e=>{
    const file=e.target.files[0];if(!file)return;setImportErr('');
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const lines=ev.target.result.trim().split('\n');const hdrs=lines[0].split(',').map(h=>h.trim());
        const miss=['fecha','dir','resultado','rr'].filter(r=>!hdrs.includes(r));
        if(miss.length){setImportErr(`Columnas faltantes: ${miss.join(', ')}`);return;}
        const imp=lines.slice(1).map((line,i)=>{const vals=line.split(',');const o={};hdrs.forEach((h,j)=>o[h]=vals[j]?.trim()||'');return{id:Date.now()+i,fecha:o.fecha||'',dir:o.dir||'L',resultado:o.resultado||'W',rr:parseFloat(o.rr)||0,sesion:o.sesion||'NY (7–10 AM)',par:o.par||'EUR/USD',mercado:o.mercado||'FX',zona:o.zona||'OB',sesgo:o.sesgo||'Alcista',adherencia:o.adherencia!=='false',notas:o.notas||''};}).filter(t=>t.fecha);
        if(!imp.length){setImportErr('No se encontraron trades válidos.');return;}
        setState(s=>({...s,trades:[...imp,...s.trades]}));setView('log');setImportErr('');
      }catch(err){setImportErr('Error al leer el archivo.');}
    };
    reader.readAsText(file);e.target.value='';
  };
  const exportCSV=()=>{
    const csv=['fecha,dir,resultado,rr,par,mercado,sesion,zona,sesgo,adherencia,notas',...trades.map(t=>`${t.fecha},${t.dir},${t.resultado},${t.rr},${t.par||''},${t.mercado||'FX'},${t.sesion||''},${t.zona||''},${t.sesgo||''},${t.adherencia},${t.notas||''}`)].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mcs_trades.csv';a.click();
  };

  const filtered=useMemo(()=>trades.filter(t=>{
    if(filters.resultado!=='Todos'&&t.resultado!==filters.resultado)return false;
    if(filters.sesion!=='Todas'&&t.sesion!==filters.sesion)return false;
    if(filters.mercado!=='Todos'&&t.mercado!==filters.mercado)return false;
    return true;
  }),[trades,filters]);
  const m=calcM(filtered);
  const afc=Object.values(filters).filter(v=>v!=='Todos'&&v!=='Todas').length;
  const allSessions=[...new Set(Object.values(MARKETS).flatMap(m=>m.sessions))];

  return(
    <div style={{paddingTop:28}}>
      <div className="eyebrow">{trades.length} entradas</div>
      <div className="page-title">Trades</div>
      <div className="page-sub">Tu cuaderno vivo. Cada uno cuenta.</div>

      <div className="tsw">
        {[['log','Log'],['agregar','Agregar'],['importar','Importar']].map(([v,l])=>(
          <button key={v} className={`tswb${view===v?' on':''}`} onClick={()=>setView(v)}>{l}</button>
        ))}
      </div>

      {view==='agregar'&&(
        <div style={{marginBottom:16}}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:22,fontWeight:600,marginBottom:20,color:BLK}}>Nuevo trade</div>

/* ── MÉTRICAS ── */
function EqChart({trades,capital,riskPct}){
  const ref=useRef(null);const cRef=useRef(null);
  const pts=useMemo(()=>calcEq(trades,capital,riskPct),[trades,capital,riskPct]);
  useEffect(()=>{
    if(!ref.current||pts.length<2)return;
    if(cRef.current)cRef.current.destroy();
    cRef.current=new Chart(ref.current,{
      type:'line',
      data:{labels:pts.map(p=>p.x),datasets:[{data:pts.map(p=>p.y),borderColor:BLUE,borderWidth:2,pointBackgroundColor:pts.map((p,i)=>i===0?'transparent':rC(p.t?.resultado||'BE')),pointBorderColor:pts.map((p,i)=>i===0?'transparent':rC(p.t?.resultado||'BE')),pointRadius:pts.map((_,i)=>i===0?0:5),fill:{target:'origin',above:'rgba(30,61,92,0.05)',below:'rgba(139,48,32,0.05)'},tension:0.25}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'$'+ctx.parsed.y.toLocaleString()}}},scales:{x:{grid:{display:false},ticks:{maxTicksLimit:5,font:{size:10,family:'JetBrains Mono'},color:INK40,maxRotation:45},border:{color:INK15}},y:{grid:{color:'rgba(156,148,133,0.15)'},ticks:{font:{size:10,family:'JetBrains Mono'},color:INK40,callback:v=>'$'+v.toLocaleString()},border:{color:INK15}}}}
    });
    return()=>{if(cRef.current){cRef.current.destroy();cRef.current=null;}};
  },[pts]);
  if(pts.length<2)return<div style={{fontFamily:"'Instrument Serif',serif",fontStyle:'italic',fontSize:14,color:INK40,textAlign:'center',padding:'2rem 0'}}>Agrega trades para ver la curva.</div>;
  const fin=pts[pts.length-1].y,pnl=parseFloat((fin-capital).toFixed(2)),pct=parseFloat(((pnl/capital)*100).toFixed(2)),dd=calcDD(pts);
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
        <MCard label="Capital actual" value={`$${fin.toLocaleString()}`} sub={`inicio $${capital.toLocaleString()}`}/>
        <MCard label="P&L total" value={`${pnl>=0?'+':''}$${pnl.toLocaleString()}`} sub={`${pct>=0?'+':''}${pct}%`} accent={pnl>=0} danger={pnl<0}/>
      </div>
      <div style={{display:'flex',gap:16,fontSize:10,color:INK40,marginBottom:10,flexWrap:'wrap',textTransform:'uppercase',letterSpacing:'0.06em',fontWeight:600}}>
        {[[WIN,'Win'],[LOSS,'Loss'],[BE,'BE']].map(([c,l])=>(
          <span key={l} style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:7,height:7,background:c,borderRadius:2,display:'inline-block'}}/>{l}</span>
        ))}
        <span style={{marginLeft:'auto',fontFamily:"'JetBrains Mono',monospace",fontSize:10}}>Max DD {dd}%</span>
      </div>
      <div style={{position:'relative',height:200}}><canvas ref={ref} role="img" aria-label="Curva de equity"/></div>
    </div>
  );
}

function MetricasTab({state}){
  const trades=state.trades||[];
  const m=calcM(trades);
  const strk=calcStrk(trades);
  const bs=bestSes(trades);
  const pts=calcEq(trades,state.capital,state.riskOp||1);
  const dd=calcDD(pts);
  const bySes=useMemo(()=>{const map={};trades.forEach(t=>{if(!map[t.sesion])map[t.sesion]={w:0,l:0,be:0};if(t.resultado==='W')map[t.sesion].w++;else if(t.resultado==='L')map[t.sesion].l++;else map[t.sesion].be++;});return Object.entries(map).map(([s,v])=>({s,tot:v.w+v.l+v.be,wr:Math.round(v.w/(v.w+v.l+v.be)*100),...v})).sort((a,b)=>b.wr-a.wr);},[trades]);
  const byZone=useMemo(()=>{const map={};trades.forEach(t=>{if(!t.zona)return;if(!map[t.zona])map[t.zona]={w:0,l:0};if(t.resultado==='W')map[t.zona].w++;else if(t.resultado==='L')map[t.zona].l++;});return Object.entries(map).map(([z,v])=>({z,tot:v.w+v.l,wr:Math.round(v.w/(v.w+v.l)*100),...v})).sort((a,b)=>b.tot-a.tot);},[trades]);

  if(!trades.length)return(
    <div style={{paddingTop:28}}>
      <div className="eyebrow">Análisis</div>
      <div className="page-title">Métricas</div>
      <div className="page-sub">Las cifras llegarán cuando el cuaderno tenga vida.</div>

        <div style={{fontFamily:"'Instrument Serif',serif",fontStyle:'italic',fontSize:15,color:INK70,lineHeight:1.8}}>Aún sin trades.<br/>Comienza a registrar para ver tu edge.</div>

  return(
    <div style={{paddingTop:28}}>
      <div className="eyebrow">Análisis</div>
      <div className="page-title">Métricas</div>
      <div className="page-sub">Rendimiento estadístico del sistema.</div>

      <div className="lbl">Curva de equity</div>
      <div className="card" style={{marginBottom:24}}><EqChart trades={trades} capital={state.capital} riskPct={state.riskOp||1}/></div>

      <div className="lbl">Métricas globales</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:24}}>
        <MCard label="Win rate" value={`${m.wr}%`} sub={`${m.wins}W · ${m.losses}L`}/>
        <MCard label="Expectativa" value={m.exp} sub={m.exp>0?'con edge':'sin edge'} accent={m.exp>0} danger={m.exp<0}/>
        <MCard label="RR promedio" value={m.rrAvg} sub="ajustado"/>
        <MCard label="Adherencia" value={`${m.adh}%`} sub={m.adh>=85?'ok':'meta 85%'} accent={m.adh>=85} danger={m.adh<70}/>
      </div>

      <div className="lbl">Riesgo</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:24}}>
        <MCard label="Max drawdown" value={`${dd}%`} sub={dd<6?'dentro del límite':'supera el 6%'} danger={dd>=6}/>
        <MCard label="Mejor sesión" value={bs} sub="≥2 trades"/>
        <MCard label="Racha win" value={strk.win} sub="máxima"/>
        <MCard label="Racha loss" value={strk.loss} sub="máxima" danger={strk.loss>=3}/>

            </div>

    <div style={{paddingTop:28}}>

        <div key={mes} style={{marginBottom:24}}>
          <div className="lbl">Mes {mes}</div>
          {WEEKS.filter(w=>w.mes===mes).map(w=>{
            const done=(wp[w.n]||[]);const pct=Math.round(done.length/w.checks.length*100);const isOpen=open===w.n;
            return(
              <div key={w.n} className={`week-card${isOpen?' active':''}`} onClick={()=>setOpen(isOpen?null:w.n)}>

                      <span style={{fontSize:12,fontWeight:700,fontFamily:"'Fraunces',serif",color:pct===100||isOpen?'#fff':INK70}}>{w.n}</span>
                    </div>
                    <div>
                      <div style={{fontSize:13,fontWeight:600,color:BLK}}>{w.focus}</div>
                      <div style={{fontSize:11,color:INK40,fontStyle:'italic'}}>Mes {w.mes}</div>
                    </div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:12,fontWeight:600,fontFamily:"'Fraunces',serif",color:pct===100?WIN:INK40}}>{pct}%</span>
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke={INK40} strokeWidth="1.5" strokeLinecap="round" style={{transform:isOpen?'rotate(180deg)':'none',transition:'transform 0.2s'}}><polyline points="2,5 7,9 12,5"/></svg>
                  </div>
                </div>
                <div className="pbar"><div className="pbar-fill" style={{width:`${pct}%`,background:pct===100?WIN:BLUE}}/></div>

                {isOpen&&(

                        <div key={i} onClick={toggle} className={`chk-item${checked?' ok':''}`}>
                          <Chk checked={checked} onChange={toggle}/>
                          <span className={`chk-lbl${checked?' ok':''}`}>{c}</span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

/* ── CALCULADORA ── */
function CalcTab({state,setState}){
  const{capital,riskVal,riskOp,wr,rr}=state;
  const exp=parseFloat(((wr/100*rr)-(1-wr/100)).toFixed(2));
  const riskV=(capital*(riskVal||0.5)/100);
  const riskO=(capital*(riskOp||1.0)/100);

  return(
    <div style={{paddingTop:28}}>
      <div className="eyebrow">Gestión MCS</div>
      <div className="page-title">Calculadora</div>
      <div className="page-sub">Riesgo y expectativa, en su sitio.</div>

      {/* Capital */}
      <div className="lbl">Capital base</div>
      <FRow label="Capital ($)">
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <input className="finput" type="number" value={capital} min={500} max={150000} step={100}
            onChange={e=>{const n=parseFloat(e.target.value);if(!isNaN(n)&&n>=500&&n<=150000)setState(s=>({...s,capital:n}));}}
            style={{fontSize:20,fontFamily:"'Fraunces',serif",fontWeight:600}}
          />
          <span style={{fontSize:12,color:INK40,fontFamily:"'JetBrains Mono',monospace"}}>USD</span>
        </div>
      </FRow>

      <Div/>

      {/* Riesgo */}
      <div className="lbl">Riesgo por trade</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:16}}>
        <FRow label="Validación %" mb={0}>
          <input className="finput" type="number" value={riskVal||0.5} min={0.25} max={3} step={0.25}
            onChange={e=>{const n=parseFloat(e.target.value);if(!isNaN(n))setState(s=>({...s,riskVal:n}));}}
            style={{fontSize:18,fontFamily:"'Fraunces',serif",fontWeight:600}}
          />
        </FRow>
        <FRow label="Operando %" mb={0}>
          <input className="finput" type="number" value={riskOp||1.0} min={0.25} max={3} step={0.25}
            onChange={e=>{const n=parseFloat(e.target.value);if(!isNaN(n))setState(s=>({...s,riskOp:n}));}}
            style={{fontSize:18,fontFamily:"'Fraunces',serif",fontWeight:600}}
          />
        </FRow>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:0}}>
        <MCard label="Riesgo validación" value={`$${riskV.toFixed(0)}`} sub={`${riskVal||0.5}% capital`}/>
        <MCard label="Riesgo operando" value={`$${riskO.toFixed(0)}`} sub={`${riskOp||1.0}% capital`} accent/>
      </div>

      <Div/>

      {/* Límites */}
      <div className="lbl">Límites MCS</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:0}}>
        <MCard label="Pérd. máx. día" value={`$${(capital*0.02).toFixed(0)}`} sub="2% del capital" danger/>
        <MCard label="Máx. trades/día" value="2" sub="sin excepciones"/>
        <MCard label="SL > 1.5% precio" value="Invalida" sub="zona mal definida" danger/>
        <MCard label="Swing parado" value="48h" sub="cerrar posición"/>
      </div>

      <Div/>

      {/* Expectativa */}
      <div className="lbl">Expectativa del sistema</div>
      <div className="formula">
        E = (WR × RR) − (1 − WR)
        <div style={{fontSize:11,marginTop:4,color:INK40,fontStyle:'italic'}}>E {'>'} 0 = sistema con edge estadístico</div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,marginBottom:16}}>
        <FRow label="Win rate %" mb={0}>
          <input className="finput" type="number" value={wr} min={1} max={99} step={1}
            onChange={e=>{const n=parseFloat(e.target.value);if(!isNaN(n)&&n>=1&&n<=99)setState(s=>({...s,wr:n}));}}
            style={{fontSize:18,fontFamily:"'Fraunces',serif",fontWeight:600}}
          />
        </FRow>
        <FRow label="RR promedio" mb={0}>
          <input className="finput" type="number" value={rr} min={0.5} max={10} step={0.1}
            onChange={e=>{const n=parseFloat(e.target.value);if(!isNaN(n)&&n>=0.5&&n<=10)setState(s=>({...s,rr:parseFloat(n.toFixed(1))}));}}
            style={{fontSize:18,fontFamily:"'Fraunces',serif",fontWeight:600}}
          />
        </FRow>
      </div>

      {/* Big expectativa result */}
      <div style={{background:exp>0?BLUE2:exp<0?LOSSBG:BG2,border:`1px solid ${exp>0?BLUEB:exp<0?LOSSB:INK15}`,borderRadius:14,padding:'20px 20px',marginBottom:12,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style={{fontSize:10,color:exp>0?BLUE:exp<0?LOSS:INK40,textTransform:'uppercase',letterSpacing:'0.09em',fontWeight:600,marginBottom:4}}>Expectativa</div>
          <div style={{fontFamily:"'Instrument Serif',serif",fontStyle:'italic',fontSize:13,color:exp>0?BLUE:exp<0?LOSS:INK70}}>
            {exp>0?`+$${Math.abs(exp).toFixed(2)} por $1 arriesgado`:exp<0?`-$${Math.abs(exp).toFixed(2)} por $1 arriesgado`:'Sistema en breakeven'}
          </div>
        </div>
        <div style={{fontSize:44,fontWeight:600,color:exp>0?BLUE:exp<0?LOSS:INK40,fontFamily:"'Fraunces',serif",letterSpacing:'-2px',lineHeight:1}}>{exp>0?'+':''}{exp}</div>
      </div>
      <div style={{display:'inline-block',fontSize:11,padding:'5px 16px',borderRadius:20,background:exp>0?BLUE2:exp<0?LOSSBG:BG2,color:exp>0?BLUE:exp<0?LOSS:INK70,fontWeight:700,letterSpacing:'0.07em',textTransform:'uppercase',border:`1px solid ${exp>0?BLUEB:exp<0?LOSSB:INK15}`}}>
        {exp>0?'Con edge':exp<0?'Sin edge':'Breakeven'}
      </div>
    </div>
  );
}

/* ── APP ── */
const NAV=[
  {id:'inicio',label:'Inicio',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>},
  {id:'metricas',label:'Métricas',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>},
  {id:'trades',label:'Trades',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>},
  {id:'mcs',label:'MCS',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="12" x2="16" y2="14"/></svg>},
  {id:'semanas',label:'Semanas',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>},
  {id:'calc',label:'Calc.',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="16" y2="12"/><line x1="8" y1="17" x2="10" y2="17"/><line x1="14" y1="17" x2="16" y2="17"/></svg>},
];

function App(){
  const[state,setRaw]=useState(load);
  const set=useCallback(upd=>{setRaw(prev=>{const next=typeof upd==='function'?upd(prev):upd;save(next);return next;});},[]);
  const panels={
    inicio:<InicioTab state={state} setState={set}/>,
    mcs:<MCSTab state={state} setState={set}/>,
    trades:<TradesTab state={state} setState={set}/>,
    metricas:<MetricasTab state={state}/>,
    semanas:<SemanasTab state={state} setState={set}/>,
    calc:<CalcTab state={state} setState={set}/>,
  };
  return(
    <>
      {panels[state.activeTab]||panels['inicio']}
      <nav className="bnav">
        {NAV.map(({id,label,icon})=>(
          <button key={id} className={`nbtn${state.activeTab===id?' on':''}`} onClick={()=>set(s=>({...s,activeTab:id}))}>
            {icon}
            <span className="nbtn-lbl">{label}</span>
          </button>
        ))}
      </nav>
    </>
  );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
