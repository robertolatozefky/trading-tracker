<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trading Tracker">
<meta name="theme-color" content="#ffffff">
<title>Trading Tracker</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111;font-size:16px}
body{overscroll-behavior:none}
#root{max-width:480px;margin:0 auto;padding:0 16px 80px}
input,select,textarea,button{font-family:inherit}
button{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* dark mode */
@media(prefers-color-scheme:dark){
  html,body{background:#1a1a1a;color:#f0f0f0}
  .card{background:#2a2a2a!important;border-color:rgba(255,255,255,0.1)!important}
  .surface{background:#222!important}
  .txt-sec{color:#aaa!important}
  .txt-ter{color:#666!important}
  input,select{background:#2a2a2a!important;color:#f0f0f0!important;border-color:rgba(255,255,255,0.15)!important}
}

/* nav bottom */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:0.5px solid rgba(0,0,0,0.1);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
@media(prefers-color-scheme:dark){.bottom-nav{background:#1a1a1a;border-top-color:rgba(255,255,255,0.1)}}
.nav-btn{flex:1;padding:10px 4px 8px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#888;cursor:pointer}
.nav-btn.active{color:#111}
@media(prefers-color-scheme:dark){.nav-btn.active{color:#f0f0f0}}
.nav-icon{width:22px;height:22px}

/* filter pills */
.pill{font-size:12px;padding:5px 11px;border-radius:20px;border:0.5px solid rgba(0,0,0,0.15);background:transparent;color:#666;cursor:pointer;white-space:nowrap}
.pill.active{background:#111;color:#fff;border-color:#111}
@media(prefers-color-scheme:dark){.pill{border-color:rgba(255,255,255,0.15);color:#aaa}.pill.active{background:#f0f0f0;color:#111}}

/* form inputs */
.finput{width:100%;padding:8px 10px;font-size:14px;border:0.5px solid rgba(0,0,0,0.2);border-radius:8px;background:#fff;color:#111;outline:none}
.finput:focus{border-color:rgba(0,0,0,0.4)}
</style>
</head>
<body>
<h1 class="sr-only">Trading Tracker — seguimiento de backtesting y trades SMC/ICT</h1>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useCallback,useMemo,useRef}=React;
const SK='tt_v3';

/* ── datos ── */
const WEEKS=[
  {n:1,mes:1,focus:'Un solo setup',task:'Elige 1 setup SMC/ICT. Define reglas de entrada, SL y TP por escrito.',checks:['Setup elegido y nombrado','Reglas de entrada documentadas','SL y TP definidos por escrito']},
  {n:2,mes:1,focus:'Backtesting × 25',task:'25 trades históricos en TradingView. Solo el setup elegido.',checks:['25 trades completados','Resultados registrados','Screenshot de cada trade']},
  {n:3,mes:1,focus:'Backtesting × 50',task:'25 trades más. Calcular win rate y RR promedio por primera vez.',checks:['50 trades totales','Win rate calculado','RR promedio calculado']},
  {n:4,mes:1,focus:'Revisión de mes 1',task:'Analizar los 50 trades. ¿Expectativa positiva? ¿Mejor sesión?',checks:['Análisis completado','Expectativa calculada','Sesión óptima identificada']},
  {n:5,mes:2,focus:'Paper trading live',task:'Ejecutar el setup en demo en tiempo real. NY open y/o power hour.',checks:['Cuenta demo activa','Trades ejecutados','Journal iniciado']},
  {n:6,mes:2,focus:'Journaling estricto',task:'Cada trade con screenshot + razón + emoción. Identificar patrones de error.',checks:['100% trades con screenshot','Emoción registrada','Patrón de error identificado']},
  {n:7,mes:2,focus:'Ajuste de reglas',task:'Refinar el setup según lo observado. No cambiar setup completo — ajustar filtros.',checks:['Filtros ajustados','Setup refinado','Reglas actualizadas']},
  {n:8,mes:2,focus:'Decisión go/no-go',task:'¿60+ trades con expectativa positiva? Considera prop firm o micro live.',checks:['60+ trades totales','Expectativa positiva','Decisión tomada']},
];
const CHECKLIST=['¿El HTF confirma dirección (H4/D1)?','¿El setup es exactamente el que definí?','¿Estoy en la sesión correcta?','¿El SL está definido antes de entrar?','¿El riesgo es máximo 1% del capital?','¿Entro por setup o por impulso/FOMO?'];
const SESIONES=['NY Open','Power Hour','London','Asia'];
const DS={activeTab:'semanas',weekProgress:{},trades:[],capital:5000,riskPct:1,wr:45,rr:2.0,activeWeek:1,checklist:{},checklistDate:''};

function load(){try{const r=localStorage.getItem(SK);if(r)return{...DS,...JSON.parse(r)}}catch(e){}return DS}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s))}catch(e){}}

/* ── colores ── */
const isDark=()=>window.matchMedia('(prefers-color-scheme:dark)').matches;
const WIN='#1D9E75',WIN_BG='#E1F5EE',WIN_TXT='#0F6E56';
const LOSS='#E24B4A',LOSS_BG='#FCEBEB',LOSS_TXT='#A32D2D';
const BE='#BA7517',BE_BG='#FAEEDA',BE_TXT='#854F0B';
const rColor=r=>r==='W'?WIN:r==='L'?LOSS:BE;
const rBg=r=>r==='W'?WIN_BG:r==='L'?LOSS_BG:BE_BG;
const rTxt=r=>r==='W'?WIN_TXT:r==='L'?LOSS_TXT:BE_TXT;
const rLabel=r=>r==='W'?'Win':r==='L'?'Loss':'BE';

/* ── cálculos ── */
function calcMetrics(trades){
  if(!trades.length)return{wr:0,rrAvg:0,exp:0,adh:0,wins:0,losses:0,total:0,avgWinRR:0};
  const wins=trades.filter(t=>t.resultado==='W');
  const losses=trades.filter(t=>t.resultado==='L');
  const wr=wins.length/trades.length;
  const avgWinRR=wins.length?wins.reduce((a,t)=>a+(parseFloat(t.rr)||0),0)/wins.length:0;
  const exp=(wr*avgWinRR)-(1-wr);
  const rrSum=trades.reduce((a,t)=>a+(t.resultado==='W'?parseFloat(t.rr)||0:-1),0);
  const adh=trades.filter(t=>t.adherencia).length/trades.length;
  return{wr:Math.round(wr*100),rrAvg:parseFloat((rrSum/trades.length).toFixed(2)),exp:parseFloat(exp.toFixed(2)),adh:Math.round(adh*100),wins:wins.length,losses:losses.length,total:trades.length,avgWinRR:parseFloat(avgWinRR.toFixed(2))};
}
function calcEquity(trades,cap,rPct){
  if(!trades.length)return[];
  const sorted=[...trades].sort((a,b)=>a.fecha<b.fecha?-1:1);
  let c=cap;
  const pts=[{x:'Inicio',y:c,t:null}];
  sorted.forEach((t,i)=>{
    const risk=c*(rPct/100);
    const delta=t.resultado==='W'?(risk*(parseFloat(t.rr)||0)):t.resultado==='L'?-risk:0;
    c=parseFloat((c+delta).toFixed(2));
    pts.push({x:t.fecha||`T${i+1}`,y:c,t});
  });
  return pts;
}
function calcDD(pts){
  let peak=pts[0]?.y||0,max=0;
  pts.forEach(p=>{if(p.y>peak)peak=p.y;const dd=(peak-p.y)/peak*100;if(dd>max)max=dd;});
  return parseFloat(max.toFixed(2));
}
function calcStreak(trades){
  const s=[...trades].sort((a,b)=>a.fecha<b.fecha?-1:1);
  let mW=0,mL=0,cW=0,cL=0;
  s.forEach(t=>{if(t.resultado==='W'){cW++;cL=0;if(cW>mW)mW=cW;}else if(t.resultado==='L'){cL++;cW=0;if(cL>mL)mL=cL;}else{cW=0;cL=0;}});
  return{win:mW,loss:mL};
}
function bestSes(trades){
  if(!trades.length)return'—';
  const m={};
  trades.forEach(t=>{if(!m[t.sesion])m[t.sesion]={w:0,tot:0};m[t.sesion].tot++;if(t.resultado==='W')m[t.sesion].w++;});
  let best='—',br=-1;
  Object.entries(m).forEach(([s,v])=>{const r=v.w/v.tot;if(r>br&&v.tot>=2){br=r;best=s;}});
  return best;
}

/* ── UI primitivos ── */
function Lbl({children,mb=10}){return<div style={{fontSize:11,fontWeight:500,color:'#999',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:mb}}>{children}</div>}
function Bdg({children,type='n'}){
  const m={s:{bg:WIN_BG,c:WIN_TXT},d:{bg:LOSS_BG,c:LOSS_TXT},w:{bg:BE_BG,c:BE_TXT},i:{bg:'#E6F1FB',c:'#185FA5'},n:{bg:'#f0f0f0',c:'#666'}};
  const s=m[type]||m.n;
  return<span style={{fontSize:11,padding:'3px 9px',borderRadius:20,background:s.bg,color:s.c,fontWeight:500}}>{children}</span>;
}
function MCard({label,value,sub,type}){
  const m={s:{bg:WIN_BG,c:WIN_TXT},d:{bg:LOSS_BG,c:LOSS_TXT},w:{bg:BE_BG,c:BE_TXT}};
  const s=type&&m[type];
  return<div style={{background:s?s.bg:'#f5f5f3',borderRadius:8,padding:'12px 14px'}}><div style={{fontSize:12,color:s?s.c:'#666',marginBottom:4}}>{label}</div><div style={{fontSize:20,fontWeight:500,color:s?s.c:'#111'}}>{value}</div>{sub&&<div style={{fontSize:11,color:s?s.c:'#999',marginTop:2}}>{sub}</div>}</div>;
}
function Pill({label,active,onClick}){return<button className={`pill${active?' active':''}`} onClick={onClick}>{label}</button>}
function FRow({label,children}){return<div style={{marginBottom:12}}><div style={{fontSize:12,color:'#666',marginBottom:5}}>{label}</div>{children}</div>}
function FInput(p){return<input className="finput" {...p}/>}
function FSelect({value,onChange,children}){return<select className="finput" value={value} onChange={onChange}>{children}</select>}
function Chk({checked,onChange}){return(
  <div onClick={onChange} style={{width:18,height:18,borderRadius:4,border:`0.5px solid ${checked?WIN:'rgba(0,0,0,0.25)'}`,background:checked?WIN:'transparent',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
    {checked&&<svg width="11" height="9" viewBox="0 0 11 9"><polyline points="1,4.5 4.5,8 10,1" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
  </div>
);}
function Divider(){return<div style={{height:'0.5px',background:'rgba(0,0,0,0.08)',margin:'16px 0'}}/>}

/* ── Semanas ── */
function SemanasTab({state,setState}){
  const{weekProgress,activeWeek}=state;
  const toggle=(wn,i)=>setState(s=>({...s,weekProgress:{...s.weekProgress,[`${wn}-${i}`]:!s.weekProgress[`${wn}-${i}`]}}));
  const isDone=w=>w.checks.every((_,i)=>weekProgress[`${w.n}-${i}`]);
  const cw=WEEKS.find(w=>w.n===activeWeek)||WEEKS[0];
  const totalDone=WEEKS.filter(isDone).length;
  return(
    <div style={{paddingTop:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <Lbl mb={0}>Plan de 8 semanas</Lbl>
        <Bdg type={totalDone===8?'s':'n'}>{totalDone}/8 completadas</Bdg>
      </div>

      <div style={{display:'flex',gap:8,marginBottom:20,overflowX:'auto',paddingBottom:4}}>
        {WEEKS.map(w=>{const done=isDone(w),active=w.n===activeWeek;return(
          <button key={w.n} onClick={()=>setState(s=>({...s,activeWeek:w.n}))} style={{minWidth:40,height:40,borderRadius:8,border:`0.5px solid ${active?'rgba(0,0,0,0.3)':'rgba(0,0,0,0.1)'}`,background:done?WIN:active?'#fff':'#f5f5f3',color:done?'#fff':active?'#111':'#999',fontWeight:active||done?500:400,fontSize:14,flexShrink:0}}>
            {w.n}
          </button>
        )})}
      </div>

      <div className="card" style={{border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:12,padding:'16px',marginBottom:20}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
          <div>
            <div style={{fontSize:11,color:'#999',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:4}}>Semana {cw.n} — Mes {cw.mes}</div>
            <div style={{fontSize:17,fontWeight:500}}>{cw.focus}</div>
          </div>
          {isDone(cw)&&<Bdg type="s">Lista</Bdg>}
        </div>
        <div style={{fontSize:14,color:'#666',marginBottom:14,lineHeight:1.6}}>{cw.task}</div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {cw.checks.map((c,i)=>{const checked=!!weekProgress[`${cw.n}-${i}`];return(
            <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10}} onClick={()=>toggle(cw.n,i)}>
              <Chk checked={checked} onChange={()=>toggle(cw.n,i)}/>
              <span style={{fontSize:14,color:checked?'#999':'#111',textDecoration:checked?'line-through':'none',lineHeight:1.4,cursor:'pointer'}}>{c}</span>
            </div>
          )})}
        </div>
      </div>

      <Lbl>Resumen por mes</Lbl>
      {[1,2].map(mes=>(
        <div key={mes} className="card" style={{border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:12,padding:'14px',marginBottom:10}}>
          <div style={{fontSize:12,color:'#999',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:10}}>
            Mes {mes} — {mes===1?'Backtesting':'Paper trading'}
          </div>
          {WEEKS.filter(w=>w.mes===mes).map((w,i,arr)=>(
            <div key={w.n} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderTop:i===0?'none':`0.5px solid rgba(0,0,0,0.06)`}}>
              <div>
                <span style={{fontSize:12,color:'#999',marginRight:6}}>S{w.n}</span>
                <span style={{fontSize:13}}>{w.focus}</span>
              </div>
              {isDone(w)
                ?<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill={WIN}/><polyline points="5,9 7.5,12 13,6" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/></svg>
                :<div style={{width:18,height:18,borderRadius:'50%',border:'0.5px solid rgba(0,0,0,0.15)'}}/>
              }
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

/* ── Trades ── */
function TradesTab({state,setState}){
  const[view,setView]=useState('log');
  const[form,setForm]=useState({fecha:'',dir:'L',resultado:'W',rr:'',sesion:'NY Open',semana:1,notas:'',adherencia:true});
  const[filters,setFilters]=useState({resultado:'Todos',sesion:'Todas',semana:'Todas',mes:'Todos'});
  const[importErr,setImportErr]=useState('');
  const fileRef=useRef(null);
  const trades=state.trades||[];

  const addTrade=()=>{
    if(!form.fecha||!form.rr)return;
    const wk=WEEKS.find(w=>w.n===parseInt(form.semana));
    const t={...form,id:Date.now(),rr:parseFloat(form.rr),mes:wk?.mes||1};
    setState(s=>({...s,trades:[t,...s.trades]}));
    setForm({fecha:'',dir:'L',resultado:'W',rr:'',sesion:'NY Open',semana:1,notas:'',adherencia:true});
    setView('log');
  };

  const delTrade=id=>setState(s=>({...s,trades:s.trades.filter(t=>t.id!==id)}));

  const importCSV=e=>{
    const file=e.target.files[0];if(!file)return;setImportErr('');
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const lines=ev.target.result.trim().split('\n');
        const hdrs=lines[0].split(',').map(h=>h.trim());
        const miss=['fecha','dir','resultado','rr'].filter(r=>!hdrs.includes(r));
        if(miss.length){setImportErr(`Columnas faltantes: ${miss.join(', ')}`);return;}
        const imp=lines.slice(1).map((line,i)=>{
          const vals=line.split(',');
          const o={};hdrs.forEach((h,j)=>o[h]=vals[j]?.trim()||'');
          return{id:Date.now()+i,fecha:o.fecha||'',dir:o.dir||'L',resultado:o.resultado||'W',rr:parseFloat(o.rr)||0,sesion:o.sesion||'NY Open',semana:parseInt(o.semana)||1,mes:parseInt(o.mes)||1,adherencia:o.adherencia!=='false',notas:o.notas||''};
        }).filter(t=>t.fecha);
        if(!imp.length){setImportErr('No se encontraron trades válidos.');return;}
        setState(s=>({...s,trades:[...imp,...s.trades]}));
        setView('log');setImportErr('');
      }catch(err){setImportErr('Error al leer el archivo. Verifica el formato.');}
    };
    reader.readAsText(file);e.target.value='';
  };

  const exportCSV=()=>{
    const csv=['fecha,dir,resultado,rr,semana,mes,sesion,adherencia,notas',...trades.map(t=>`${t.fecha},${t.dir},${t.resultado},${t.rr},${t.semana||1},${t.mes||1},${t.sesion},${t.adherencia},${t.notas||''}`)].join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='trades_backup.csv';a.click();
  };

  const filtered=useMemo(()=>trades.filter(t=>{
    if(filters.resultado!=='Todos'&&t.resultado!==filters.resultado)return false;
    if(filters.sesion!=='Todas'&&t.sesion!==filters.sesion)return false;
    if(filters.semana!=='Todas'&&String(t.semana)!==String(filters.semana))return false;
    if(filters.mes!=='Todos'&&String(t.mes)!==String(filters.mes))return false;
    return true;
  }),[trades,filters]);

  const m=calcMetrics(filtered);
  const afc=Object.values(filters).filter(v=>v!=='Todos'&&v!=='Todas').length;

  return(
    <div style={{paddingTop:20}}>
      <div style={{display:'flex',gap:6,marginBottom:20,overflowX:'auto',paddingBottom:2}}>
        {[['log','Log'],['agregar','+ Agregar'],['importar','↑ Importar']].map(([v,l])=>(
          <button key={v} onClick={()=>setView(v)} style={{fontSize:13,padding:'7px 14px',borderRadius:8,border:`0.5px solid ${view===v?'rgba(0,0,0,0.3)':'rgba(0,0,0,0.1)'}`,background:view===v?'#111':'transparent',color:view===v?'#fff':'#666',whiteSpace:'nowrap',flexShrink:0}}>
            {l}
          </button>
        ))}
      </div>

      {view==='agregar'&&(
        <div className="card" style={{border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:12,padding:'16px',marginBottom:16}}>
          <FRow label="Fecha"><FInput type="date" value={form.fecha} onChange={e=>setForm(f=>({...f,fecha:e.target.value}))}/></FRow>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <FRow label="Dirección"><FSelect value={form.dir} onChange={e=>setForm(f=>({...f,dir:e.target.value}))}><option value="L">Long</option><option value="S">Short</option></FSelect></FRow>
            <FRow label="Resultado"><FSelect value={form.resultado} onChange={e=>setForm(f=>({...f,resultado:e.target.value}))}><option value="W">Win</option><option value="L">Loss</option><option value="BE">Breakeven</option></FSelect></FRow>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            <FRow label="RR realizado"><FInput type="number" step="0.1" placeholder="2.0" value={form.rr} onChange={e=>setForm(f=>({...f,rr:e.target.value}))}/></FRow>
            <FRow label="Semana"><FSelect value={form.semana} onChange={e=>setForm(f=>({...f,semana:parseInt(e.target.value)}))}>{WEEKS.map(w=><option key={w.n} value={w.n}>S{w.n} M{w.mes}</option>)}</FSelect></FRow>
          </div>
          <FRow label="Sesión"><FSelect value={form.sesion} onChange={e=>setForm(f=>({...f,sesion:e.target.value}))}>{SESIONES.map(s=><option key={s}>{s}</option>)}</FSelect></FRow>
          <FRow label="Notas"><FInput placeholder="Observación rápida..." value={form.notas} onChange={e=>setForm(f=>({...f,notas:e.target.value}))}/></FRow>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}} onClick={()=>setForm(f=>({...f,adherencia:!f.adherencia}))}>
            <Chk checked={form.adherencia} onChange={()=>setForm(f=>({...f,adherencia:!f.adherencia}))}/>
            <span style={{fontSize:14,color:'#666',cursor:'pointer'}}>¿Seguí exactamente el plan?</span>
          </div>
          <button onClick={addTrade} disabled={!form.fecha||!form.rr} style={{width:'100%',padding:'12px',fontSize:15,fontWeight:500,border:'none',borderRadius:10,background:form.fecha&&form.rr?'#111':'#ccc',color:'#fff',cursor:form.fecha&&form.rr?'pointer':'default'}}>
            Guardar trade
          </button>
        </div>
      )}

      {view==='importar'&&(
        <div className="card" style={{border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:12,padding:'16px',marginBottom:16}}>
          <div style={{fontSize:14,color:'#666',marginBottom:12,lineHeight:1.6}}>Sube el CSV exportado desde esta app. Columnas requeridas: <code style={{fontSize:12,background:'#f0f0f0',padding:'1px 5px',borderRadius:4}}>fecha, dir, resultado, rr</code></div>
          <div style={{background:'#f5f5f3',borderRadius:8,padding:'10px 12px',marginBottom:14,fontFamily:'monospace',fontSize:11,color:'#666',lineHeight:1.8,overflowX:'auto',whiteSpace:'nowrap'}}>
            fecha,dir,resultado,rr,semana,mes,sesion,notas<br/>
            2024-01-15,L,W,2.1,1,1,NY Open,CHoCH
          </div>
          <input ref={fileRef} type="file" accept=".csv" onChange={importCSV} style={{display:'none'}}/>
          <button onClick={()=>fileRef.current?.click()} style={{width:'100%',padding:'12px',fontSize:15,border:'0.5px solid rgba(0,0,0,0.2)',borderRadius:10,background:'transparent',color:'#111',cursor:'pointer',marginBottom:8}}>
            Seleccionar archivo CSV
          </button>
          {importErr&&<div style={{fontSize:13,color:LOSS_TXT,background:LOSS_BG,padding:'8px 12px',borderRadius:8,marginTop:8}}>{importErr}</div>}
          <div style={{fontSize:12,color:'#999',marginTop:10}}>Los trades importados se agregan al historial existente.</div>
        </div>
      )}

      {view==='log'&&(
        <>
          <div className="card" style={{border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:12,padding:'14px',marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
              <Lbl mb={0}>Filtros</Lbl>
              {afc>0&&<button onClick={()=>setFilters({resultado:'Todos',sesion:'Todas',semana:'Todas',mes:'Todos'})} style={{fontSize:12,color:'#999',background:'none',border:'none',cursor:'pointer'}}>Limpiar</button>}
            </div>
            {[
              {label:'Resultado',key:'resultado',opts:['Todos','W','L','BE'],fmt:v=>v==='W'?'Win':v==='L'?'Loss':v==='BE'?'Breakeven':v},
              {label:'Sesión',key:'sesion',opts:['Todas',...SESIONES],fmt:v=>v},
              {label:'Semana',key:'semana',opts:['Todas','1','2','3','4','5','6','7','8'],fmt:v=>v==='Todas'?'Todas':`S${v}`},
              {label:'Mes',key:'mes',opts:['Todos','1','2'],fmt:v=>v==='Todos'?'Todos':`Mes ${v}`},
            ].map(({label,key,opts,fmt})=>(
              <div key={key} style={{marginBottom:10}}>
                <div style={{fontSize:11,color:'#bbb',marginBottom:6}}>{label}</div>
                <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:2}}>
                  {opts.map(v=><Pill key={v} label={fmt(v)} active={filters[key]===v} onClick={()=>setFilters(f=>({...f,[key]:v}))}/>)}
                </div>
              </div>
            ))}
          </div>

          {filtered.length>0&&(
            <>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
                <Lbl mb={0}>{afc>0?`${filtered.length} de ${trades.length}`:`${trades.length} trades`}</Lbl>
                {afc>0&&<Bdg type="i">{afc} filtro{afc>1?'s':''}</Bdg>}
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
                <MCard label="Win rate" value={`${m.wr}%`} sub={`${m.wins}W · ${m.losses}L`}/>
                <MCard label="Expectativa" value={m.exp} sub={m.exp>0?'con edge':'sin edge'} type={m.exp>0?'s':'d'}/>
              </div>
            </>
          )}

          {trades.length===0&&<div style={{fontSize:14,color:'#bbb',textAlign:'center',padding:'3rem 0',lineHeight:1.8}}>Sin trades aún.<br/>Toca "+ Agregar" para empezar.</div>}
          {trades.length>0&&filtered.length===0&&<div style={{fontSize:14,color:'#bbb',textAlign:'center',padding:'2rem 0'}}>Ningún trade coincide con los filtros.</div>}

          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {filtered.map(t=>(
              <div key={t.id} className="card" style={{border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:10,padding:'12px 14px'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:13,fontWeight:500,color:rTxt(t.resultado),background:rBg(t.resultado),padding:'3px 10px',borderRadius:20}}>{rLabel(t.resultado)}</span>
                    <span style={{fontSize:14,fontWeight:500}}>{t.dir==='L'?'Long':'Short'}</span>
                    <span style={{fontSize:14,color:'#666'}}>RR {t.rr}</span>
                  </div>
                  <button onClick={()=>delTrade(t.id)} style={{fontSize:13,color:'#bbb',background:'none',border:'none',padding:'4px 6px',cursor:'pointer',lineHeight:1}}>✕</button>
                </div>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',fontSize:12,color:'#999'}}>
                  <span>{t.fecha}</span>
                  <span>·</span><span>{t.sesion}</span>
                  <span>·</span><span>S{t.semana||'?'} M{t.mes||'?'}</span>
                  {!t.adherencia&&<><span>·</span><span style={{color:LOSS_TXT}}>fuera de plan</span></>}
                </div>
                {t.notas&&<div style={{fontSize:13,color:'#888',marginTop:6,fontStyle:'italic'}}>{t.notas}</div>}
              </div>
            ))}
          </div>

          {trades.length>0&&(
            <button onClick={exportCSV} style={{marginTop:14,width:'100%',padding:'10px',fontSize:13,border:'0.5px solid rgba(0,0,0,0.15)',borderRadius:10,background:'transparent',color:'#666',cursor:'pointer'}}>
              Exportar CSV ↓
            </button>
          )}
        </>
      )}
    </div>
  );
}

/* ── Métricas ── */
function EquityChart({trades,capital,riskPct}){
  const ref=useRef(null);const chartRef=useRef(null);
  const pts=useMemo(()=>calcEquity(trades,capital,riskPct),[trades,capital,riskPct]);
  useEffect(()=>{
    if(!ref.current||pts.length<2)return;
    if(chartRef.current)chartRef.current.destroy();
    const dark=isDark();
    const axColor=dark?'#666':'#bbb';
    const gridColor=dark?'rgba(255,255,255,0.05)':'rgba(0,0,0,0.04)';
    chartRef.current=new Chart(ref.current,{
      type:'line',
      data:{labels:pts.map(p=>p.x),datasets:[{
        data:pts.map(p=>p.y),
        borderColor:WIN,borderWidth:2,
        pointBackgroundColor:pts.map((p,i)=>i===0?'transparent':rColor(p.t?.resultado||'BE')),
        pointBorderColor:pts.map((p,i)=>i===0?'transparent':rColor(p.t?.resultado||'BE')),
        pointRadius:pts.map((_,i)=>i===0?0:5),
        pointHoverRadius:7,fill:false,tension:0.15,
      }]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'$'+ctx.parsed.y.toLocaleString()}}},
        scales:{
          x:{grid:{display:false},ticks:{maxTicksLimit:5,font:{size:11},color:axColor,maxRotation:45}},
          y:{grid:{color:gridColor},ticks:{font:{size:11},color:axColor,callback:v=>'$'+v.toLocaleString()}},
        }
      }
    });
    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[pts]);
  if(pts.length<2)return<div style={{fontSize:14,color:'#bbb',textAlign:'center',padding:'2rem 0'}}>Agrega trades para ver la curva.</div>;
  const fin=pts[pts.length-1].y,pnl=parseFloat((fin-capital).toFixed(2)),pct=parseFloat(((pnl/capital)*100).toFixed(2)),dd=calcDD(pts);
  return(
    <div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
        <MCard label="Capital actual" value={`$${fin.toLocaleString()}`} sub={`inicio $${capital.toLocaleString()}`}/>
        <MCard label="P&L total" value={`${pnl>=0?'+':''}$${pnl.toLocaleString()}`} sub={`${pct>=0?'+':''}${pct}%`} type={pnl>=0?'s':'d'}/>
      </div>
      <div style={{display:'flex',gap:14,fontSize:12,color:'#888',marginBottom:10,flexWrap:'wrap'}}>
        {[['Win',WIN],['Loss',LOSS],['BE',BE]].map(([l,c])=>(
          <span key={l} style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:8,height:8,borderRadius:'50%',background:c,display:'inline-block'}}/>{l}</span>
        ))}
        <span style={{marginLeft:'auto',fontSize:12,color:'#999'}}>Max DD: {dd}%</span>
      </div>
      <div style={{position:'relative',height:200}}>
        <canvas ref={ref} role="img" aria-label={`Curva de equity desde $${capital} hasta $${fin}`}/>
      </div>
    </div>
  );
}

function MetricasTab({state}){
  const trades=state.trades||[];
  const m=calcMetrics(trades);
  const streak=calcStreak(trades);
  const bs=bestSes(trades);
  const pts=calcEquity(trades,state.capital,state.riskPct);
  const dd=calcDD(pts);
  const bySession=useMemo(()=>{
    const map={};
    trades.forEach(t=>{if(!map[t.sesion])map[t.sesion]={w:0,l:0,be:0};if(t.resultado==='W')map[t.sesion].w++;else if(t.resultado==='L')map[t.sesion].l++;else map[t.sesion].be++;});
    return Object.entries(map).map(([s,v])=>({s,tot:v.w+v.l+v.be,wr:Math.round(v.w/(v.w+v.l+v.be)*100),...v})).sort((a,b)=>b.wr-a.wr);
  },[trades]);

  if(!trades.length)return<div style={{fontSize:14,color:'#bbb',textAlign:'center',padding:'3rem 1rem',lineHeight:1.8}}>Sin trades registrados.<br/>Agrega trades en el log para ver métricas.</div>;

  return(
    <div style={{paddingTop:20}}>
      <Lbl>Curva de equity</Lbl>
      <div className="card" style={{border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:12,padding:'14px',marginBottom:20}}>
        <EquityChart trades={trades} capital={state.capital} riskPct={state.riskPct}/>
      </div>

      <Lbl>Métricas globales</Lbl>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:20}}>
        <MCard label="Win rate" value={`${m.wr}%`} sub={`${m.wins}W · ${m.losses}L · ${m.total-(m.wins+m.losses)}BE`}/>
        <MCard label="Expectativa" value={m.exp} sub={m.exp>0?'con edge':'sin edge'} type={m.exp>0?'s':'d'}/>
        <MCard label="RR promedio" value={m.rrAvg} sub="por trade"/>
        <MCard label="Adherencia" value={`${m.adh}%`} sub={m.adh>=85?'objetivo ok':'meta: 85%'} type={m.adh>=85?'s':m.adh>=70?'w':'d'}/>
      </div>

      <Lbl>Gestión de riesgo</Lbl>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:20}}>
        <MCard label="Max drawdown" value={`${dd}%`} sub={dd<6?'dentro del límite':'supera el 6%'} type={dd>6?'d':dd>3?'w':'s'}/>
        <MCard label="Mejor sesión" value={bs} sub="mayor win rate (≥2)"/>
        <MCard label="Racha win máx." value={streak.win} sub="consecutivos"/>
        <MCard label="Racha loss máx." value={streak.loss} sub="consecutivos" type={streak.loss>=3?'d':'n'}/>
      </div>

      <Lbl>Win rate por sesión</Lbl>
      <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:20}}>
        {bySession.map(({s,tot,wr,w,l})=>(
          <div key={s} className="card" style={{border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:10,padding:'12px 14px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:14,fontWeight:500}}>{s}</span>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <span style={{fontSize:12,color:'#999'}}>{tot} trades</span>
                <span style={{fontSize:15,fontWeight:500,color:wr>=50?WIN:LOSS}}>{wr}%</span>
              </div>
            </div>
            <div style={{height:4,borderRadius:2,background:'#f0f0f0',overflow:'hidden'}}>
              <div style={{height:'100%',width:`${wr}%`,background:wr>=50?WIN:LOSS,borderRadius:2}}/>
            </div>
          </div>
        ))}
        {bySession.length===0&&<div style={{fontSize:13,color:'#bbb'}}>Sin datos de sesión aún.</div>}
      </div>

      <Lbl>Umbrales para ir live</Lbl>
      <div className="card" style={{border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:12,padding:'14px'}}>
        {[
          {label:'Muestra mínima',display:`${m.total} trades`,ok:m.total>=60,meta:'60 trades'},
          {label:'Expectativa positiva',display:String(m.exp),ok:m.exp>0,meta:'> 0'},
          {label:'Adherencia al plan',display:`${m.adh}%`,ok:m.adh>=85,meta:'85%'},
          {label:'Drawdown máximo',display:`${dd}%`,ok:dd<6,meta:'< 6%'},
        ].map(({label,display,ok,meta},i,arr)=>(
          <div key={label} style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:i<arr.length-1?'0.5px solid rgba(0,0,0,0.06)':'none'}}>
            <div style={{width:20,height:20,borderRadius:'50%',background:ok?WIN:LOSS,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
              {ok
                ?<svg width="11" height="9" viewBox="0 0 11 9"><polyline points="1,4.5 4.5,8 10,1" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/></svg>
                :<svg width="9" height="9" viewBox="0 0 9 9"><line x1="1" y1="1" x2="8" y2="8" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/><line x1="8" y1="1" x2="1" y2="8" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/></svg>
              }
            </div>
            <span style={{fontSize:14,flex:1}}>{label}</span>
            <span style={{fontSize:14,fontWeight:500,color:ok?WIN:LOSS}}>{display}</span>
            <span style={{fontSize:11,color:'#bbb'}}>{meta}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Calculadora ── */
function CalcTab({state,setState}){
  const{capital,riskPct,wr,rr}=state;
  const exp=parseFloat(((wr/100*rr)-(1-wr/100)).toFixed(2));
  const riskAmt=Math.round(capital*riskPct/100);
  const Sl=({label,val,min,max,step=1,onChange})=>(
    <div style={{marginBottom:18}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
        <span style={{fontSize:14,color:'#666'}}>{label}</span>
        <span style={{fontSize:14,fontWeight:500}}>{val}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={val} onChange={onChange} style={{width:'100%',height:4,accentColor:'#111'}}/>
    </div>
  );
  return(
    <div style={{paddingTop:20}}>
      <Lbl>Calculadora de expectativa</Lbl>
      <div style={{background:'#f5f5f3',borderRadius:8,padding:'12px 14px',marginBottom:20,fontFamily:'monospace',fontSize:15}}>
        E = (WR × RR) − (1 − WR)
        <div style={{fontSize:12,fontFamily:'sans-serif',color:'#999',marginTop:4}}>Resultado &gt; 0 = sistema con edge</div>
      </div>
      <Sl label={`Win rate — ${wr}%`} val={wr} min={1} max={99} onChange={e=>setState(s=>({...s,wr:+e.target.value}))}/>
      <Sl label={`RR promedio — ${rr}`} val={rr} min={0.5} max={5} step={0.1} onChange={e=>setState(s=>({...s,rr:parseFloat(e.target.value)}))}/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 0',borderTop:'0.5px solid rgba(0,0,0,0.08)',borderBottom:'0.5px solid rgba(0,0,0,0.08)',marginBottom:20}}>
        <span style={{fontSize:15,fontWeight:500}}>Expectativa</span>
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:26,fontWeight:500}}>{exp}</span>
          <Bdg type={exp>0?'s':exp===0?'n':'d'}>{exp>0?'Con edge':exp===0?'Breakeven':'Sin edge'}</Bdg>
        </div>
      </div>
      <div style={{fontSize:13,color:'#999',marginBottom:28,lineHeight:1.6}}>
        {exp>0?`Por cada $1 arriesgado, ganas $${Math.abs(exp)} en promedio a largo plazo.`:exp===0?'El sistema no gana ni pierde. Mejora el RR o el win rate.':`Por cada $1 arriesgado, pierdes $${Math.abs(exp)} a largo plazo. Revisar setup.`}
      </div>
      <Lbl>Riesgo por trade</Lbl>
      <Sl label={`Capital — $${capital.toLocaleString()}`} val={capital} min={500} max={50000} step={500} onChange={e=>setState(s=>({...s,capital:+e.target.value}))}/>
      <Sl label={`Riesgo — ${riskPct}%`} val={riskPct} min={0.5} max={3} step={0.5} onChange={e=>setState(s=>({...s,riskPct:+e.target.value}))}/>
      <div style={{background:'#f5f5f3',borderRadius:10,padding:'14px 16px',display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <span style={{fontSize:14,color:'#666'}}>Riesgo por trade</span>
        <span style={{fontSize:24,fontWeight:500}}>${riskAmt.toLocaleString()}</span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <MCard label="Stop loss máx." value={`$${riskAmt}`} sub="si SL = 100% riesgo"/>
        <MCard label="5 pérdidas seguidas" value={`$${(riskAmt*5).toLocaleString()}`} sub="drawdown potencial"/>
      </div>
    </div>
  );
}

/* ── Checklist ── */
function CheckTab({state,setState}){
  const today=new Date().toISOString().slice(0,10);
  const isToday=state.checklistDate===today;
  const checks=isToday?(state.checklist||{}):{};
  const toggle=i=>{const nc={...checks,[i]:!checks[i]};setState(s=>({...s,checklist:nc,checklistDate:today}));};
  const done=CHECKLIST.filter((_,i)=>checks[i]).length;
  const all=done===CHECKLIST.length;
  return(
    <div style={{paddingTop:20}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <Lbl mb={0}>Pre-trade — {today}</Lbl>
        <Bdg type={all?'s':done>0?'w':'n'}>{done}/{CHECKLIST.length}</Bdg>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:20}}>
        {CHECKLIST.map((c,i)=>{const checked=!!checks[i];return(
          <div key={i} onClick={()=>toggle(i)} style={{display:'flex',alignItems:'flex-start',gap:12,background:checked?WIN_BG:'#fff',border:`0.5px solid ${checked?WIN:'rgba(0,0,0,0.08)'}`,borderRadius:10,padding:'12px 14px',cursor:'pointer'}}>
            <Chk checked={checked} onChange={()=>toggle(i)}/>
            <span style={{fontSize:14,color:checked?WIN_TXT:'#111',textDecoration:checked?'line-through':'none',lineHeight:1.5}}>{c}</span>
          </div>
        )})}
      </div>
      {all&&(
        <div style={{background:WIN_BG,borderRadius:10,padding:'12px 16px',fontSize:14,color:WIN_TXT,fontWeight:500,marginBottom:20,textAlign:'center'}}>
          Todo confirmado — puedes evaluar entrada.
        </div>
      )}
      <Divider/>
      <Lbl>Journal por trade (Notion)</Lbl>
      {[{c:'#378ADD',t:'Antes',d:'Screenshot marcado, razón de entrada, HTF, sesión, SL y TP en puntos.'},{c:WIN,t:'Después',d:'Resultado (W/L), RR realizado, ¿seguí el plan?, P&L.'},{c:BE,t:'Psicología',d:'Estado emocional. ¿Moví el SL? ¿Saqué antes de tiempo? Honestidad total.'}].map(item=>(
        <div key={item.t} className="card" style={{display:'flex',gap:12,marginBottom:10,border:'0.5px solid rgba(0,0,0,0.08)',borderRadius:10,padding:'12px 14px'}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:item.c,flexShrink:0,marginTop:6}}/>
          <div><div style={{fontSize:14,fontWeight:500,marginBottom:3}}>{item.t}</div><div style={{fontSize:13,color:'#666',lineHeight:1.5}}>{item.d}</div></div>
        </div>
      ))}
    </div>
  );
}

/* ── App ── */
const NAV=[
  {id:'semanas',label:'Semanas',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>},
  {id:'trades',label:'Trades',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>},
  {id:'metricas',label:'Métricas',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>},
  {id:'calc',label:'Calc.',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="10" y2="12"/><line x1="14" y1="12" x2="16" y2="12"/><line x1="8" y1="17" x2="10" y2="17"/><line x1="14" y1="17" x2="16" y2="17"/></svg>},
  {id:'checklist',label:'Check',icon:<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5"><polyline points="9,11 12,14 22,4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>},
];

function App(){
  const[state,setRaw]=useState(load);
  const set=useCallback(upd=>{setRaw(prev=>{const next=typeof upd==='function'?upd(prev):upd;save(next);return next;});} ,[]);
  const panels={semanas:<SemanasTab state={state} setState={set}/>,trades:<TradesTab state={state} setState={set}/>,metricas:<MetricasTab state={state}/>,calc:<CalcTab state={state} setState={set}/>,checklist:<CheckTab state={state} setState={set}/>};
  return(
    <>
      <div id="root-content">
        {panels[state.activeTab]}
      </div>
      <nav className="bottom-nav">
        {NAV.map(({id,label,icon})=>(
          <button key={id} className={`nav-btn${state.activeTab===id?' active':''}`} onClick={()=>set(s=>({...s,activeTab:id}))}>
            <span className="nav-icon">{icon}</span>
            <span>{label}</span>
          </button>
        ))}
      </nav>
    </>
  );
}
ReactDOM.render(<App/>,document.getElementById('root'));
</script>
